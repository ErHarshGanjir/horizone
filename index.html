<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <title>Horizon</title>

    <link
        rel="icon"
        type="image/png"
        href="https://i.ibb.co/kgzJb34B/horizon-logo.png"
    >

    <meta
        name="theme-color"
        content="#080b12"
    >

    <style>

        /* =========================================================
           HORIZON
           ========================================================= */

        :root {

            --bg: #080b12;
            --bg-soft: #0d111a;

            --card: rgba(18,23,34,0.82);
            --card-hover: rgba(27,34,49,0.96);

            --border: rgba(255,255,255,0.08);
            --border-hover: rgba(255,255,255,0.16);

            --text: #f4f7fb;
            --muted: #8c96a8;

            --accent: #3498db;
            --accent-soft: rgba(52,152,219,0.14);

            --danger: #ff5f6d;
            --success: #42d17d;

            --radius: 24px;

        }


        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }


        html,
        body {

            width: 100%;
            min-height: 100%;

        }


        body {

            font-family:
                Inter,
                ui-sans-serif,
                system-ui,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;

            color: var(--text);

            background:

                radial-gradient(
                    circle at 10% 0%,
                    rgba(52,152,219,0.09),
                    transparent 30%
                ),

                radial-gradient(
                    circle at 90% 10%,
                    rgba(113,76,255,0.08),
                    transparent 30%
                ),

                var(--bg);

            overflow-x: hidden;

        }


        button {
            font-family: inherit;
        }


        /* =========================================================
           DASHBOARD
           ========================================================= */

        #dashboard {

            width: 100%;
            min-height: 100vh;

            transition:
                opacity .3s ease,
                transform .3s ease;

        }


        #dashboard.hidden {

            opacity: 0;
            pointer-events: none;
            transform: scale(.985);

        }


        /* =========================================================
           MAIN CONTAINER
           ========================================================= */

        .main-content {

            width: min(1450px, 100%);

            margin: auto;

            padding:
                55px
                clamp(18px, 5vw, 55px)
                70px;

        }


        /* =========================================================
           HORIZON HOME LOGO
           ========================================================= */

        .home-brand {

            display: flex;

            flex-direction: column;

            align-items: center;

            justify-content: center;

            padding:
                25px
                20px
                45px;

            user-select: none;

        }


        .home-logo {

            width:
                clamp(115px, 14vw, 185px);

            height:
                clamp(115px, 14vw, 185px);

            object-fit: contain;

            margin-bottom: 18px;

            filter:
                drop-shadow(
                    0 18px 35px
                    rgba(0,0,0,.35)
                );

            animation:
                logoAppear .65s ease both;

        }


        .home-title {

            font-size:
                clamp(30px, 4vw, 48px);

            font-weight: 800;

            letter-spacing:
                -2px;

            line-height: 1;

            margin-bottom: 10px;

        }


        .home-subtitle {

            color: var(--muted);

            font-size:
                clamp(12px, 1.4vw, 15px);

            text-align: center;

            max-width: 500px;

        }


        @keyframes logoAppear {

            from {

                opacity: 0;

                transform:
                    translateY(15px)
                    scale(.92);

            }

            to {

                opacity: 1;

                transform:
                    translateY(0)
                    scale(1);

            }

        }


        /* =========================================================
           SECTION TITLE
           ========================================================= */

        .section-header {

            display: flex;

            align-items: center;

            justify-content: space-between;

            margin-bottom: 16px;

        }


        .section-title {

            font-size: 14px;

            font-weight: 750;

            letter-spacing: -.2px;

        }


        .section-count {

            color: var(--muted);

            font-size: 11px;

        }


        /* =========================================================
           BENTO GRID
           ========================================================= */

        #bentoGrid {

            display: grid;

            grid-template-columns:
                repeat(4, minmax(0,1fr));

            grid-auto-rows:
                minmax(180px,auto);

            gap: 16px;

        }


        /* =========================================================
           CARD
           ========================================================= */

        .app-card {

            position: relative;

            min-height: 190px;

            overflow: hidden;

            padding: 22px;

            border:
                1px solid var(--border);

            border-radius:
                var(--radius);

            background:

                linear-gradient(
                    145deg,
                    rgba(255,255,255,.045),
                    rgba(255,255,255,.018)
                ),

                var(--card);

            cursor: pointer;

            display: flex;

            flex-direction: column;

            justify-content: space-between;

            transition:

                transform .28s
                cubic-bezier(.2,.8,.2,1),

                border-color .28s ease,

                background .28s ease,

                box-shadow .28s ease;

            animation:
                cardAppear .5s ease both;

        }


        .app-card:hover {

            transform:
                translateY(-5px)
                scale(1.008);

            border-color:
                var(--border-hover);

            background:

                linear-gradient(
                    145deg,
                    rgba(255,255,255,.075),
                    rgba(255,255,255,.025)
                ),

                var(--card-hover);

            box-shadow:
                0 20px 50px
                rgba(0,0,0,.28);

        }


        .app-card:active {

            transform:
                scale(.985);

        }


        .app-card.large {

            grid-column: span 2;
            grid-row: span 2;

        }


        .app-card.wide {

            grid-column: span 2;

        }


        .app-card.tall {

            grid-row: span 2;

        }


        /* =========================================================
           CARD GLOW
           ========================================================= */

        .card-glow {

            position: absolute;

            width: 180px;
            height: 180px;

            right: -80px;
            bottom: -100px;

            border-radius: 50%;

            background:

                radial-gradient(
                    circle,
                    rgba(52,152,219,.16),
                    transparent 70%
                );

            pointer-events: none;

            transition:
                transform .4s ease;

        }


        .app-card:hover
        .card-glow {

            transform:
                scale(1.5);

        }


        /* =========================================================
           CARD TOP
           ========================================================= */

        .card-top {

            display: flex;

            align-items: flex-start;

            justify-content: space-between;

        }


        .app-logo {

            width: 50px;
            height: 50px;

            object-fit: contain;

            padding: 8px;

            border-radius: 15px;

            background:
                rgba(255,255,255,.06);

            border:
                1px solid rgba(255,255,255,.07);

        }


        .card-status {

            display: flex;

            align-items: center;

            gap: 6px;

        }


        .status-dot {

            width: 8px;
            height: 8px;

            border-radius: 50%;

            background:
                var(--success);

            box-shadow:
                0 0 12px
                rgba(66,209,125,.65);

        }


        .lock-icon {

            font-size: 12px;

            opacity: .65;

        }


        /* =========================================================
           CARD CONTENT
           ========================================================= */

        .card-content {

            margin-top: 20px;

        }


        .card-title {

            font-size: 18px;

            font-weight: 750;

            letter-spacing:
                -.4px;

            margin-bottom: 7px;

        }


        .card-description {

            color: var(--muted);

            font-size: 12px;

            line-height: 1.55;

            max-width: 90%;

        }


        /* =========================================================
           HOVER TEXT
           ========================================================= */

        .hover-text {

            position: absolute;

            left: 22px;
            bottom: 18px;

            color:
                #91d4ff;

            font-size: 11px;

            font-weight: 650;

            opacity: 0;

            transform:
                translateY(7px);

            transition:

                opacity .25s ease,

                transform .25s ease;

        }


        .app-card:hover
        .hover-text {

            opacity: 1;

            transform:
                translateY(0);

        }


        /* =========================================================
           IMPORTANT LINKS
           ========================================================= */

        .important-section {

            margin-top: 60px;

        }


        .important-links {

            display: grid;

            grid-template-columns:
                repeat(3, minmax(0,1fr));

            gap: 12px;

        }


        .important-link {

            border:
                1px solid var(--border);

            background:
                rgba(255,255,255,.025);

            border-radius: 17px;

            padding: 15px 16px;

            display: flex;

            align-items: center;

            justify-content: space-between;

            gap: 12px;

            transition:
                .2s ease;

        }


        .important-link:hover {

            background:
                rgba(255,255,255,.055);

            border-color:
                var(--border-hover);

        }


        .important-info {

            min-width: 0;

        }


        .important-name {

            font-size: 13px;

            font-weight: 700;

            margin-bottom: 5px;

        }


        .important-url {

            color:
                var(--muted);

            font-size: 11px;

            white-space: nowrap;

            overflow: hidden;

            text-overflow: ellipsis;

            max-width: 300px;

        }


        .important-actions {

            display: flex;

            gap: 6px;

            flex-shrink: 0;

        }


        .link-button {

            height: 34px;

            padding:
                0 11px;

            border-radius: 10px;

            border:
                1px solid rgba(255,255,255,.08);

            background:
                rgba(255,255,255,.045);

            color:
                #dfe5ef;

            cursor: pointer;

            font-size: 11px;

            font-weight: 650;

            transition:
                .2s ease;

        }


        .link-button:hover {

            background:
                rgba(255,255,255,.10);

        }


        .link-button.open {

            background:
                var(--accent-soft);

            color:
                #8ed3ff;

            border-color:
                rgba(52,152,219,.18);

        }


        .copy-success {

            color:
                var(--success) !important;

        }


        /* =========================================================
           FOOTER
           ========================================================= */

        .footer {

            margin-top: 55px;

            text-align: center;

            color:
                rgba(255,255,255,.28);

            font-size: 10px;

        }


        /* =========================================================
           IFRAME VIEWER
           ========================================================= */

        #viewer {

            position: fixed;

            inset: 0;

            z-index: 100;

            display: none;

            background:
                #05070b;

            opacity: 0;

        }


        #viewer.active {

            display: block;

            animation:
                viewerIn .3s ease forwards;

        }


        #viewer iframe {

            width: 100%;
            height: 100%;

            border: none;

            display: block;

            background: white;

        }


        /* =========================================================
           VIEWER TOOLBAR
           ========================================================= */

        .viewer-toolbar {

            position: fixed;

            top: 14px;
            left: 50%;

            transform:
                translateX(-50%);

            z-index: 120;

            height: 50px;

            display: flex;

            align-items: center;

            gap: 7px;

            padding: 5px;

            border-radius: 16px;

            background:
                rgba(12,15,22,.84);

            backdrop-filter:
                blur(18px);

            -webkit-backdrop-filter:
                blur(18px);

            border:
                1px solid rgba(255,255,255,.1);

            box-shadow:
                0 15px 45px
                rgba(0,0,0,.35);

            opacity: 0;

            pointer-events: none;

            transition:
                opacity .25s ease;

        }


        #viewer.active
        .viewer-toolbar {

            opacity: 1;

            pointer-events: auto;

        }


        .viewer-button {

            width: 40px;
            height: 40px;

            border: none;

            border-radius: 11px;

            background:
                rgba(255,255,255,.06);

            color:
                #e9edf4;

            cursor: pointer;

            display: flex;

            align-items: center;

            justify-content: center;

            transition:
                .2s ease;

        }


        .viewer-button:hover {

            background:
                rgba(255,255,255,.12);

            transform:
                translateY(-1px);

        }


        .viewer-button.close:hover {

            background:
                rgba(255,95,109,.18);

            color:
                #ff8790;

        }


        /* =========================================================
           LOADER
           ========================================================= */

        #iframeLoader {

            position: fixed;

            inset: 0;

            z-index: 110;

            display: flex;

            align-items: center;

            justify-content: center;

            background:
                rgba(5,7,11,.92);

            backdrop-filter:
                blur(8px);

            -webkit-backdrop-filter:
                blur(8px);

            transition:
                opacity .25s ease;

        }


        #iframeLoader.hidden {

            opacity: 0;

            pointer-events: none;

        }


        .loading-wave {

            width: 300px;
            height: 100px;

            display: flex;

            justify-content: center;

            align-items: flex-end;

        }


        .loading-bar {

            width: 20px;
            height: 10px;

            margin: 0 5px;

            background-color:
                #3498db;

            border-radius: 5px;

            animation:
                loading-wave-animation
                1s ease-in-out infinite;

        }


        .loading-bar:nth-child(2) {
            animation-delay: .1s;
        }


        .loading-bar:nth-child(3) {
            animation-delay: .2s;
        }


        .loading-bar:nth-child(4) {
            animation-delay: .3s;
        }


        @keyframes loading-wave-animation {

            0% {
                height: 10px;
            }

            50% {
                height: 50px;
            }

            100% {
                height: 10px;
            }

        }


        /* =========================================================
           PASSWORD MODAL
           ========================================================= */

        #passwordModal {

            position: fixed;

            inset: 0;

            z-index: 300;

            display: flex;

            align-items: center;

            justify-content: center;

            padding: 20px;

            background:
                rgba(3,5,9,.72);

            backdrop-filter:
                blur(18px);

            -webkit-backdrop-filter:
                blur(18px);

            opacity: 0;

            visibility: hidden;

            pointer-events: none;

            transition:
                opacity .25s ease,
                visibility .25s ease;

        }


        #passwordModal.active {

            opacity: 1;

            visibility: visible;

            pointer-events: auto;

        }


        .password-box {

            width:
                min(410px,100%);

            padding: 28px;

            border-radius: 25px;

            border:
                1px solid
                rgba(255,255,255,.10);

            background:

                linear-gradient(
                    145deg,
                    rgba(28,34,48,.97),
                    rgba(13,17,26,.97)
                );

            box-shadow:
                0 30px 100px
                rgba(0,0,0,.5);

            transform:
                translateY(12px)
                scale(.97);

            transition:
                transform .25s ease;

        }


        #passwordModal.active
        .password-box {

            transform:
                translateY(0)
                scale(1);

        }


        .password-icon {

            width: 48px;
            height: 48px;

            border-radius: 15px;

            display: flex;

            align-items: center;
            justify-content: center;

            background:
                var(--accent-soft);

            border:
                1px solid
                rgba(52,152,219,.15);

            font-size: 20px;

            margin-bottom: 18px;

        }


        .password-title {

            font-size: 20px;

            font-weight: 800;

            margin-bottom: 7px;

        }


        .password-description {

            color:
                var(--muted);

            font-size: 12px;

            line-height: 1.5;

            margin-bottom: 20px;

        }


        .password-input-wrap {

            position: relative;

        }


        #passwordInput {

            width: 100%;

            height: 48px;

            border-radius: 13px;

            border:
                1px solid
                rgba(255,255,255,.10);

            outline: none;

            background:
                rgba(255,255,255,.045);

            color:
                white;

            padding:
                0 15px;

            font-size: 14px;

            transition:
                border .2s ease,
                background .2s ease;

        }


        #passwordInput:focus {

            border-color:
                rgba(52,152,219,.5);

            background:
                rgba(255,255,255,.065);

        }


        #passwordInput.error {

            border-color:
                rgba(255,95,109,.65);

            animation:
                shake .25s ease;

        }


        .password-error {

            min-height: 17px;

            margin-top: 8px;

            color:
                #ff7c87;

            font-size: 11px;

        }


        .password-actions {

            display: flex;

            gap: 8px;

            margin-top: 13px;

        }


        .password-button {

            height: 44px;

            flex: 1;

            border-radius: 12px;

            border:
                1px solid
                rgba(255,255,255,.08);

            background:
                rgba(255,255,255,.05);

            color:
                #e7ebf3;

            cursor: pointer;

            font-weight: 700;

            transition:
                .2s ease;

        }


        .password-button:hover {

            background:
                rgba(255,255,255,.10);

        }


        .password-button.primary {

            background:
                #3498db;

            border-color:
                #3498db;

            color:
                white;

        }


        .password-button.primary:hover {

            background:
                #2789c7;

        }


        @keyframes shake {

            0%,100% {
                transform: translateX(0);
            }

            25% {
                transform: translateX(-5px);
            }

            75% {
                transform: translateX(5px);
            }

        }


        /* =========================================================
           EMPTY STATE
           ========================================================= */

        .empty-state {

            grid-column:
                1 / -1;

            min-height: 250px;

            border:
                1px dashed
                rgba(255,255,255,.10);

            border-radius:
                var(--radius);

            display: flex;

            align-items: center;

            justify-content: center;

            color:
                var(--muted);

        }


        /* =========================================================
           ANIMATIONS
           ========================================================= */

        @keyframes cardAppear {

            from {

                opacity: 0;

                transform:
                    translateY(18px)
                    scale(.98);

            }

            to {

                opacity: 1;

                transform:
                    translateY(0)
                    scale(1);

            }

        }


        @keyframes viewerIn {

            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }

        }


        /* =========================================================
           TABLET
           ========================================================= */

        @media (max-width: 1000px) {

            #bentoGrid {

                grid-template-columns:
                    repeat(3,minmax(0,1fr));

            }


            .important-links {

                grid-template-columns:
                    repeat(2,minmax(0,1fr));

            }

        }


        /* =========================================================
           MOBILE
           ========================================================= */

        @media (max-width: 720px) {

            .main-content {

                padding:
                    25px
                    15px
                    50px;

            }


            .home-brand {

                padding:
                    25px
                    10px
                    35px;

            }


            #bentoGrid {

                grid-template-columns:
                    repeat(2,minmax(0,1fr));

                gap: 11px;

            }


            .app-card {

                min-height: 165px;

                padding: 17px;

                border-radius: 19px;

            }


            .app-card.large,
            .app-card.wide,
            .app-card.tall {

                grid-column: span 1;
                grid-row: span 1;

            }


            .app-card.large {

                grid-column:
                    span 2;

            }


            .app-logo {

                width: 43px;
                height: 43px;

            }


            .card-title {

                font-size: 15px;

            }


            .card-description {

                font-size: 11px;

            }


            .hover-text {

                display: none;

            }


            .important-section {

                margin-top: 40px;

            }


            .important-links {

                grid-template-columns:
                    1fr;

            }


            .important-link {

                padding: 13px;

            }


            .important-url {

                max-width:
                    200px;

            }


            .viewer-toolbar {

                top: auto;

                bottom: 14px;

            }

        }


        @media (max-width: 420px) {

            .app-card {

                min-height: 150px;

                padding: 15px;

            }


            .important-actions {

                gap: 4px;

            }


            .link-button {

                padding:
                    0 9px;

            }

        }

    </style>

</head>


<body>


<div id="dashboard">

    <main class="main-content">


        <!-- =====================================================
             HORIZON HOME
             ===================================================== -->

        <section class="home-brand">

            <img
                class="home-logo"
                src="https://i.ibb.co/kgzJb34B/horizon-logo.png"
                alt="Horizon"
            >

            <div class="home-title">
                Horizon
            </div>

            <div class="home-subtitle">
                Your digital workspace
            </div>

        </section>


        <!-- =====================================================
             APPLICATIONS
             ===================================================== -->

        <div class="section-header">

            <div class="section-title">
                Applications
            </div>

            <div
                class="section-count"
                id="appCount"
            ></div>

        </div>


        <div id="bentoGrid"></div>


        <!-- =====================================================
             IMPORTANT LINKS
             ===================================================== -->

        <section class="important-section">

            <div class="section-header">

                <div class="section-title">
                    Important Links
                </div>

                <div class="section-count">
                    Quick access
                </div>

            </div>


            <div
                class="important-links"
                id="importantLinks"
            ></div>

        </section>


        <div class="footer">
            Horizon Workspace
        </div>


    </main>

</div>



<!-- =========================================================
     IFRAME VIEWER
     ========================================================= -->

<div id="viewer">


    <!-- Viewer controls only appear after opening a website -->

    <div class="viewer-toolbar">

        <button
            class="viewer-button"
            onclick="goBack()"
            title="Back to Horizon"
        >
            ←
        </button>


        <button
            class="viewer-button"
            onclick="reloadIframe()"
            title="Reload"
        >
            ↻
        </button>


        <button
            class="viewer-button"
            onclick="openExternal()"
            title="Open in new tab"
        >
            ↗
        </button>


        <button
            class="viewer-button close"
            onclick="goBack()"
            title="Close"
        >
            ×
        </button>

    </div>


    <!-- =====================================================
         LOADER
         ===================================================== -->

    <div id="iframeLoader">

        <div class="loading-wave">

            <div class="loading-bar"></div>

            <div class="loading-bar"></div>

            <div class="loading-bar"></div>

            <div class="loading-bar"></div>

        </div>

    </div>


    <iframe
        id="siteFrame"
        title="Horizon Website Viewer"
        allowfullscreen
    ></iframe>

</div>



<!-- =========================================================
     PASSWORD MODAL
     ========================================================= -->

<div id="passwordModal">

    <div class="password-box">

        <div class="password-icon">
            🔒
        </div>


        <div class="password-title">
            Password Required
        </div>


        <div class="password-description">
            This application is protected.
            Enter the password to continue.
        </div>


        <div class="password-input-wrap">

            <input
                type="password"
                id="passwordInput"
                placeholder="Enter password"
                autocomplete="off"
            >

        </div>


        <div
            class="password-error"
            id="passwordError"
        ></div>


        <div class="password-actions">

            <button
                class="password-button"
                onclick="cancelPassword()"
            >
                Cancel
            </button>


            <button
                class="password-button primary"
                onclick="submitPassword()"
            >
                Continue
            </button>

        </div>

    </div>

</div>



<script>


/* =============================================================
   HORIZON DATA
   ============================================================= */


/*
    =============================================================
    MAIN APPLICATION DATA

    PASSWORD OPTIONS:

    password: ""

        No password.
        Opens immediately.


    password: ["pass1"]

        One password.


    password: ["pass1", "pass2", "pass3"]

        Multiple passwords.
        ANY ONE of them will work.


    password can also be written as:

    password: ["admin123", "harsh123", "horizon123"]


    ENABLE:

    enabled: 1

        Visible.


    enabled: 0

        Hidden.


    SIZE:

    normal
    wide
    tall
    large

    =============================================================
*/


const horizonApps = [


    {
        name: "Example",

        iframeLink:
            "https://example.com",

        logo:
            "https://i.ibb.co/kgzJb34B/horizon-logo.png",

        description:
            "Example application. Replace this with your website.",

        enabled: 0,

        hoverText:
            "Open Example",

        size:
            "large",

        password:
            ""

    },


    {
        name: "Google",

        iframeLink:
            "https://www.google.com",

        logo:
            "https://www.google.com/favicon.ico",

        description:
            "Search the web quickly from Horizon.",

        enabled: 1,

        hoverText:
            "Open Google",

        size:
            "normal",

        password:
            "1234"

    },


    {
        name: "GitHub",

        iframeLink:
            "https://github.com",

        logo:
            "https://github.githubassets.com/favicons/favicon.png",

        description:
            "Manage repositories, projects and code.",

        enabled: 1,

        hoverText:
            "Open GitHub",

        size:
            "wide",

        password:
            ""

    },


    {
        name: "Private Portal",

        iframeLink:
            "https://example.com/private",

        logo:
            "https://i.ibb.co/kgzJb34B/horizon-logo.png",

        description:
            "Protected application requiring a password.",

        enabled: 1,

        hoverText:
            "Unlock application",

        size:
            "normal",

        password:
            [
                "pass1",
                "pass2",
                "pass3"
            ]

    },


    {
        name: "Gmail",

        iframeLink:
            "https://mail.google.com",

        logo:
            "https://ssl.gstatic.com/ui/v1/icons/mail/rfr/gmail.ico",

        description:
            "Access your email and communication.",

        enabled: 1,

        hoverText:
            "Open Gmail",

        size:
            "normal",

        password:
            ""

    },


    {
        name: "Drive",

        iframeLink:
            "https://drive.google.com",

        logo:
            "https://ssl.gstatic.com/images/branding/product/2x/drive_2020q4_48dp.png",

        description:
            "Access your cloud files and documents.",

        enabled: 1,

        hoverText:
            "Open Drive",

        size:
            "tall",

        password:
            ""

    }


];



/* =============================================================
   IMPORTANT LINKS
   ============================================================= */


/*
    STRUCTURE:

    {
        name: "Google Apps Script",
        url: "https://script.google.com/"
    }

*/


const importantLinks = [

    {
        name:
            "Google Apps Script",

        url:
            "https://script.google.com/"

    },


    {
        name:
            "GitHub",

        url:
            "https://github.com/"

    },


    {
        name:
            "Google Drive",

        url:
            "https://drive.google.com/"

    }

];



/* =============================================================
   ELEMENTS
   ============================================================= */

const grid =
    document.getElementById(
        "bentoGrid"
    );


const appCount =
    document.getElementById(
        "appCount"
    );


const importantLinksContainer =
    document.getElementById(
        "importantLinks"
    );


const dashboard =
    document.getElementById(
        "dashboard"
    );


const viewer =
    document.getElementById(
        "viewer"
    );


const iframe =
    document.getElementById(
        "siteFrame"
    );


const loader =
    document.getElementById(
        "iframeLoader"
    );


const passwordModal =
    document.getElementById(
        "passwordModal"
    );


const passwordInput =
    document.getElementById(
        "passwordInput"
    );


const passwordError =
    document.getElementById(
        "passwordError"
    );



let currentApp = null;

let pendingApp = null;



/* =============================================================
   ESCAPE HTML
   ============================================================= */

function escapeHTML(value) {

    if (
        value === null ||
        value === undefined
    ) {

        return "";

    }


    return String(value)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}



/* =============================================================
   GET APP NAME
   ============================================================= */

function getAppName(app) {

    if (app.name) {

        return app.name;

    }


    try {

        const url =
            new URL(
                app.iframeLink
            );

        return url.hostname

            .replace(
                /^www\./,
                ""
            )

            .split(".")[0]

            .replace(
                /^./,
                c =>
                    c.toUpperCase()
            );

    }

    catch {

        return "Application";

    }

}



/* =============================================================
   RENDER APPLICATIONS
   ============================================================= */

function renderApps() {

    grid.innerHTML = "";


    const enabledApps =
        horizonApps.filter(
            app =>
                Number(app.enabled) === 1
        );


    appCount.textContent =
        `${enabledApps.length} available`;


    if (!enabledApps.length) {

        grid.innerHTML = `

            <div class="empty-state">

                No applications are
                currently enabled.

            </div>

        `;

        return;

    }


    enabledApps.forEach(
        (app,index) => {


            const card =
                document.createElement(
                    "article"
                );


            card.className =
                `app-card ${app.size || "normal"}`;


            card.style.animationDelay =
                `${index * 45}ms`;


            const logo =
                app.logo ||
                "https://i.ibb.co/kgzJb34B/horizon-logo.png";


            const passwordProtected =
                hasPassword(app);


            card.innerHTML = `

                <div class="card-glow"></div>


                <div>

                    <div class="card-top">

                        <img

                            class="app-logo"

                            src="${escapeHTML(logo)}"

                            alt=""

                            loading="lazy"

                            onerror="
                                this.src='https://i.ibb.co/kgzJb34B/horizon-logo.png'
                            "

                        >


                        <div class="card-status">

                            ${
                                passwordProtected
                                ?
                                `<span
                                    class="lock-icon"
                                    title="Password protected"
                                >🔒</span>`
                                :
                                ""
                            }

                            <span
                                class="status-dot"
                                title="Enabled"
                            ></span>

                        </div>

                    </div>


                    <div class="card-content">

                        <div class="card-title">

                            ${escapeHTML(
                                getAppName(app)
                            )}

                        </div>


                        <div class="card-description">

                            ${escapeHTML(
                                app.description
                            )}

                        </div>

                    </div>

                </div>


                <div class="hover-text">

                    ${escapeHTML(
                        app.hoverText ||
                        "Open application"
                    )}

                    &nbsp; →

                </div>

            `;


            card.addEventListener(
                "click",
                () =>
                    handleAppClick(app)
            );


            grid.appendChild(card);

        }
    );

}



/* =============================================================
   PASSWORD DETECTION
   ============================================================= */

function hasPassword(app) {

    if (!app) {
        return false;
    }


    /*
        Empty string = no password
    */

    if (
        typeof app.password === "string"
    ) {

        return (
            app.password.trim() !== ""
        );

    }


    /*
        Array = check whether
        at least one password exists
    */

    if (
        Array.isArray(
            app.password
        )
    ) {

        return app.password.some(
            password =>
                String(password).trim() !== ""
        );

    }


    return false;

}



/* =============================================================
   NORMALIZE PASSWORDS
   ============================================================= */

function getPasswords(app) {

    if (
        typeof app.password === "string"
    ) {

        if (
            app.password.trim() === ""
        ) {

            return [];

        }

        return [
            app.password
        ];

    }


    if (
        Array.isArray(
            app.password
        )
    ) {

        return app.password
            .map(
                password =>
                    String(password)
            )
            .filter(
                password =>
                    password.trim() !== ""
            );

    }


    return [];

}



/* =============================================================
   HANDLE APP CLICK
   ============================================================= */

function handleAppClick(app) {

    if (!app) {
        return;
    }


    /*
        No password:
        Open directly.
    */

    if (!hasPassword(app)) {

        openApp(app);

        return;

    }


    /*
        Password exists:
        Show modal.
    */

    pendingApp = app;

    passwordInput.value = "";

    passwordError.textContent = "";

    passwordInput.classList.remove(
        "error"
    );

    passwordModal.classList.add(
        "active"
    );


    setTimeout(
        () => {

            passwordInput.focus();

        },
        150
    );

}



/* =============================================================
   SUBMIT PASSWORD
   ============================================================= */

function submitPassword() {

    if (!pendingApp) {
        return;
    }


    const entered =
        passwordInput.value;


    const validPasswords =
        getPasswords(
            pendingApp
        );


    const valid =
        validPasswords.some(
            password =>
                entered === password
        );


    if (!valid) {

        passwordError.textContent =
            "Incorrect password. Please try again.";

        passwordInput.classList.add(
            "error"
        );


        setTimeout(
            () => {

                passwordInput.classList.remove(
                    "error"
                );

            },
            350
        );

        passwordInput.focus();

        return;

    }


    const app =
        pendingApp;


    closePasswordModal();


    /*
        Correct password.
        Open website.
    */

    openApp(app);

}



/* =============================================================
   PASSWORD ENTER KEY
   ============================================================= */

passwordInput.addEventListener(
    "keydown",
    event => {

        if (
            event.key === "Enter"
        ) {

            submitPassword();

        }


        if (
            event.key === "Escape"
        ) {

            cancelPassword();

        }

    }
);



/* =============================================================
   CLOSE PASSWORD MODAL
   ============================================================= */

function closePasswordModal() {

    passwordModal.classList.remove(
        "active"
    );

    passwordInput.value = "";

    passwordError.textContent = "";

}



/* =============================================================
   CANCEL PASSWORD
   ============================================================= */

function cancelPassword() {

    pendingApp = null;

    closePasswordModal();

}



/* =============================================================
   OPEN APPLICATION
   ============================================================= */

function openApp(app) {

    if (
        !app ||
        !app.iframeLink
    ) {

        return;

    }


    currentApp = app;


    dashboard.classList.add(
        "hidden"
    );


    viewer.classList.add(
        "active"
    );


    loader.classList.remove(
        "hidden"
    );


    iframe.src =
        "about:blank";


    setTimeout(
        () => {

            iframe.src =
                app.iframeLink;

        },
        80
    );


    /*
        Browser history
    */

    history.pushState(
        {
            horizonViewer: true
        },
        "",
        "#app"
    );

}



/* =============================================================
   IFRAME LOAD
   ============================================================= */

iframe.addEventListener(
    "load",
    () => {

        setTimeout(
            () => {

                loader.classList.add(
                    "hidden"
                );

            },
            250
        );

    }
);



/* =============================================================
   GO BACK
   ============================================================= */

function goBack() {

    iframe.src =
        "about:blank";


    viewer.classList.remove(
        "active"
    );


    dashboard.classList.remove(
        "hidden"
    );


    currentApp = null;


    if (
        location.hash === "#app"
    ) {

        history.replaceState(
            null,
            "",
            location.pathname +
            location.search
        );

    }

}



/* =============================================================
   BROWSER BACK
   ============================================================= */

window.addEventListener(
    "popstate",
    () => {

        if (
            viewer.classList.contains(
                "active"
            )
        ) {

            goBack();

        }

    }
);



/* =============================================================
   ESCAPE
   ============================================================= */

document.addEventListener(
    "keydown",
    event => {

        if (
            event.key === "Escape"
        ) {

            if (
                passwordModal.classList.contains(
                    "active"
                )
            ) {

                cancelPassword();

                return;

            }


            if (
                viewer.classList.contains(
                    "active"
                )
            ) {

                goBack();

            }

        }

    }
);



/* =============================================================
   RELOAD IFRAME
   ============================================================= */

function reloadIframe() {

    if (!currentApp) {
        return;
    }


    loader.classList.remove(
        "hidden"
    );


    iframe.src =
        currentApp.iframeLink;

}



/* =============================================================
   OPEN EXTERNAL
   ============================================================= */

function openExternal() {

    if (
        !currentApp ||
        !currentApp.iframeLink
    ) {

        return;

    }


    window.open(
        currentApp.iframeLink,
        "_blank",
        "noopener,noreferrer"
    );

}



/* =============================================================
   RENDER IMPORTANT LINKS
   ============================================================= */

function renderImportantLinks() {

    importantLinksContainer.innerHTML =
        "";


    if (
        !importantLinks.length
    ) {

        importantLinksContainer.innerHTML = `

            <div class="empty-state">

                No important links added.

            </div>

        `;

        return;

    }


    importantLinks.forEach(
        (item,index) => {


            const wrapper =
                document.createElement(
                    "div"
                );


            wrapper.className =
                "important-link";


            const safeName =
                escapeHTML(
                    item.name
                );


            const safeURL =
                escapeHTML(
                    item.url
                );


            wrapper.innerHTML = `

                <div class="important-info">

                    <div class="important-name">

                        ${safeName}

                    </div>


                    <div class="important-url">

                        ${safeURL}

                    </div>

                </div>


                <div class="important-actions">

                    <button
                        class="link-button"
                        data-copy="${safeURL}"
                    >
                        Copy
                    </button>


                    <button
                        class="link-button open"
                        data-open="${safeURL}"
                    >
                        Open
                    </button>

                </div>

            `;


            /*
                Copy button
            */

            wrapper
                .querySelector(
                    "[data-copy]"
                )
                .addEventListener(
                    "click",
                    event => {

                        event.stopPropagation();

                        copyImportantLink(
                            item.url,
                            event.currentTarget
                        );

                    }
                );


            /*
                Open button
            */

            wrapper
                .querySelector(
                    "[data-open]"
                )
                .addEventListener(
                    "click",
                    event => {

                        event.stopPropagation();

                        openImportantLink(
                            item.url
                        );

                    }
                );


            importantLinksContainer
                .appendChild(
                    wrapper
                );

        }
    );

}



/* =============================================================
   COPY IMPORTANT LINK
   ============================================================= */

async function copyImportantLink(
    url,
    button
) {

    try {

        await navigator.clipboard.writeText(
            url
        );


        const oldText =
            button.textContent;


        button.textContent =
            "Copied ✓";


        button.classList.add(
            "copy-success"
        );


        setTimeout(
            () => {

                button.textContent =
                    oldText;

                button.classList.remove(
                    "copy-success"
                );

            },
            1500
        );

    }

    catch {

        /*
            Fallback for older browsers
        */

        const textarea =
            document.createElement(
                "textarea"
            );


        textarea.value =
            url;


        textarea.style.position =
            "fixed";

        textarea.style.opacity =
            "0";


        document.body.appendChild(
            textarea
        );


        textarea.select();

        document.execCommand(
            "copy"
        );


        textarea.remove();


        button.textContent =
            "Copied ✓";


        setTimeout(
            () => {

                button.textContent =
                    "Copy";

            },
            1500
        );

    }

}



/* =============================================================
   OPEN IMPORTANT LINK
   ============================================================= */

function openImportantLink(url) {

    if (!url) {
        return;
    }


    window.open(
        url,
        "_blank",
        "noopener,noreferrer"
    );

}



/* =============================================================
   INITIALIZE
   ============================================================= */

renderApps();

renderImportantLinks();


</script>
