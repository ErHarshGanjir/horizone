<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <title>Horizon</title>

    <!-- Favicon -->
    <link
        rel="icon"
        type="image/png"
        href="https://i.ibb.co/kgzJb34B/horizon-logo.png"
    >

    <meta name="theme-color" content="#080b12">

    <style>

        /* =========================================================
           HORIZON
           Modern Bento Web Portal
           ========================================================= */

        :root {
            --bg: #080b12;
            --bg-soft: #0d111a;
            --card: rgba(18, 23, 34, 0.82);
            --card-hover: rgba(27, 34, 49, 0.95);

            --border: rgba(255,255,255,0.08);
            --border-hover: rgba(255,255,255,0.16);

            --text: #f4f7fb;
            --muted: #8c96a8;

            --accent: #3498db;
            --accent-soft: rgba(52,152,219,0.15);

            --danger: #ff5f6d;

            --radius: 24px;

            --header-height: 76px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            width: 100%;
            height: 100%;
        }

        body {
            font-family:
                Inter,
                ui-sans-serif,
                system-ui,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;

            background:
                radial-gradient(
                    circle at 10% 10%,
                    rgba(52,152,219,0.08),
                    transparent 30%
                ),
                radial-gradient(
                    circle at 90% 20%,
                    rgba(123,92,255,0.07),
                    transparent 30%
                ),
                var(--bg);

            color: var(--text);

            overflow: hidden;
        }

        button {
            font-family: inherit;
        }


        /* =========================================================
           APP
           ========================================================= */

        #app {
            width: 100%;
            height: 100%;
            position: relative;
        }


        /* =========================================================
           DASHBOARD
           ========================================================= */

        #dashboard {
            width: 100%;
            height: 100%;
            overflow-y: auto;
            overflow-x: hidden;

            scrollbar-width: thin;
            scrollbar-color: rgba(255,255,255,0.15) transparent;

            transition:
                opacity 0.3s ease,
                transform 0.3s ease;
        }

        #dashboard.hidden {
            opacity: 0;
            pointer-events: none;
            transform: scale(0.98);
        }


        /* =========================================================
           HEADER
           ========================================================= */

        .topbar {
            height: var(--header-height);

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding:
                0 clamp(18px, 4vw, 52px);

            position: sticky;
            top: 0;
            z-index: 20;

            background:
                rgba(8,11,18,0.78);

            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);

            border-bottom: 1px solid rgba(255,255,255,0.05);
        }


        /* =========================================================
           BRAND
           ========================================================= */

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;

            user-select: none;
        }

        .brand-logo {
            width: 42px;
            height: 42px;

            object-fit: contain;

            border-radius: 12px;

            box-shadow:
                0 8px 25px rgba(0,0,0,0.3);
        }

        .brand-name {
            font-size: 20px;
            font-weight: 750;
            letter-spacing: -0.5px;
        }

        .brand-subtitle {
            font-size: 11px;
            color: var(--muted);
            margin-top: 2px;
        }


        /* =========================================================
           HEADER ACTIONS
           ========================================================= */

        .header-actions {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .icon-button {
            width: 40px;
            height: 40px;

            display: flex;
            align-items: center;
            justify-content: center;

            border: 1px solid var(--border);

            border-radius: 12px;

            background: rgba(255,255,255,0.035);

            color: #dfe5ef;

            cursor: pointer;

            transition:
                background 0.2s ease,
                border 0.2s ease,
                transform 0.2s ease;
        }

        .icon-button:hover {
            background: rgba(255,255,255,0.08);
            border-color: var(--border-hover);
            transform: translateY(-1px);
        }


        /* =========================================================
           MAIN
           ========================================================= */

        .main-content {
            width: min(1500px, 100%);

            margin: 0 auto;

            padding:
                34px
                clamp(18px, 4vw, 52px)
                60px;
        }


        /* =========================================================
           HERO
           ========================================================= */

        .hero {
            margin-bottom: 30px;
        }

        .hero-label {
            display: inline-flex;
            align-items: center;
            gap: 7px;

            padding: 7px 11px;

            border-radius: 999px;

            background: var(--accent-soft);

            border: 1px solid rgba(52,152,219,0.18);

            color: #77c8ff;

            font-size: 11px;
            font-weight: 700;

            text-transform: uppercase;
            letter-spacing: 0.8px;

            margin-bottom: 14px;
        }

        .hero-label::before {
            content: "";

            width: 6px;
            height: 6px;

            border-radius: 50%;

            background: #45b9ff;

            box-shadow:
                0 0 12px rgba(69,185,255,0.8);
        }

        .hero h1 {
            font-size:
                clamp(32px, 5vw, 60px);

            line-height: 1;

            letter-spacing: -2.8px;

            font-weight: 800;

            margin-bottom: 13px;
        }

        .hero h1 span {
            color: #8fcfff;
        }

        .hero p {
            max-width: 650px;

            color: var(--muted);

            font-size:
                clamp(13px, 1.5vw, 15px);

            line-height: 1.6;
        }


        /* =========================================================
           BENTO GRID
           ========================================================= */

        #bentoGrid {

            display: grid;

            grid-template-columns:
                repeat(4, minmax(0, 1fr));

            grid-auto-rows: minmax(180px, auto);

            gap: 16px;
        }


        /* =========================================================
           CARD
           ========================================================= */

        .app-card {

            position: relative;

            min-height: 190px;

            overflow: hidden;

            padding: 22px;

            border-radius: var(--radius);

            border: 1px solid var(--border);

            background:
                linear-gradient(
                    145deg,
                    rgba(255,255,255,0.045),
                    rgba(255,255,255,0.018)
                ),
                var(--card);

            cursor: pointer;

            display: flex;
            flex-direction: column;
            justify-content: space-between;

            transition:
                transform 0.28s cubic-bezier(.2,.8,.2,1),
                border-color 0.28s ease,
                background 0.28s ease,
                box-shadow 0.28s ease;

            animation:
                cardAppear 0.5s ease both;
        }

        .app-card:hover {

            transform:
                translateY(-5px)
                scale(1.008);

            border-color:
                rgba(255,255,255,0.16);

            background:
                linear-gradient(
                    145deg,
                    rgba(255,255,255,0.075),
                    rgba(255,255,255,0.025)
                ),
                var(--card-hover);

            box-shadow:
                0 20px 50px rgba(0,0,0,0.28);
        }

        .app-card:active {
            transform: scale(0.985);
        }


        /* =========================================================
           CARD SIZES
           ========================================================= */

        .app-card.large {
            grid-column: span 2;
            grid-row: span 2;
        }

        .app-card.wide {
            grid-column: span 2;
        }

        .app-card.tall {
            grid-row: span 2;
        }


        /* =========================================================
           CARD GLOW
           ========================================================= */

        .card-glow {

            position: absolute;

            width: 180px;
            height: 180px;

            right: -80px;
            bottom: -100px;

            border-radius: 50%;

            background:
                radial-gradient(
                    circle,
                    rgba(52,152,219,0.16),
                    transparent 70%
                );

            pointer-events: none;

            transition:
                transform 0.4s ease;
        }

        .app-card:hover .card-glow {
            transform: scale(1.5);
        }


        /* =========================================================
           CARD TOP
           ========================================================= */

        .card-top {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;

            gap: 12px;
        }

        .app-logo {

            width: 50px;
            height: 50px;

            object-fit: contain;

            padding: 8px;

            border-radius: 15px;

            background:
                rgba(255,255,255,0.06);

            border:
                1px solid rgba(255,255,255,0.07);
        }


        /* =========================================================
           CARD STATUS
           ========================================================= */

        .status-dot {

            width: 8px;
            height: 8px;

            border-radius: 50%;

            background: #41d17c;

            box-shadow:
                0 0 12px rgba(65,209,124,0.6);
        }


        /* =========================================================
           CARD CONTENT
           ========================================================= */

        .card-content {
            margin-top: 20px;
        }

        .card-title {
            font-size: 18px;
            font-weight: 750;

            letter-spacing: -0.4px;

            margin-bottom: 7px;
        }

        .card-description {
            color: var(--muted);

            font-size: 12px;

            line-height: 1.55;

            max-width: 90%;
        }


        /* =========================================================
           HOVER TEXT
           ========================================================= */

        .hover-text {

            position: absolute;

            left: 22px;
            bottom: 18px;

            color: #91d4ff;

            font-size: 11px;
            font-weight: 650;

            opacity: 0;

            transform:
                translateY(7px);

            transition:
                opacity 0.25s ease,
                transform 0.25s ease;
        }

        .app-card:hover .hover-text {
            opacity: 1;
            transform: translateY(0);
        }


        /* =========================================================
           IFRAME VIEW
           ========================================================= */

        #viewer {

            position: fixed;

            inset: 0;

            z-index: 100;

            display: none;

            background: #05070b;

            opacity: 0;
        }

        #viewer.active {
            display: block;

            animation:
                viewerIn 0.3s ease forwards;
        }

        #viewer iframe {

            width: 100%;
            height: 100%;

            border: none;

            display: block;

            background: white;
        }


        /* =========================================================
           VIEWER TOOLBAR
           ========================================================= */

        .viewer-toolbar {

            position: fixed;

            top: 14px;
            left: 50%;

            transform:
                translateX(-50%);

            z-index: 120;

            height: 50px;

            display: flex;
            align-items: center;

            gap: 7px;

            padding: 5px;

            border-radius: 16px;

            background:
                rgba(12,15,22,0.84);

            backdrop-filter:
                blur(18px);

            -webkit-backdrop-filter:
                blur(18px);

            border:
                1px solid rgba(255,255,255,0.1);

            box-shadow:
                0 15px 45px rgba(0,0,0,0.35);

            opacity: 0;

            pointer-events: none;

            transition:
                opacity 0.25s ease;
        }

        #viewer.active .viewer-toolbar {
            opacity: 1;
            pointer-events: auto;
        }

        .viewer-button {

            width: 40px;
            height: 40px;

            border: none;

            border-radius: 11px;

            background:
                rgba(255,255,255,0.06);

            color: #e9edf4;

            cursor: pointer;

            display: flex;
            align-items: center;
            justify-content: center;

            transition:
                background 0.2s ease,
                transform 0.2s ease;
        }

        .viewer-button:hover {

            background:
                rgba(255,255,255,0.12);

            transform:
                translateY(-1px);
        }

        .viewer-button.close:hover {
            background:
                rgba(255,95,109,0.18);

            color:
                #ff8790;
        }


        /* =========================================================
           LOADER
           ========================================================= */

        #iframeLoader {

            position: fixed;

            inset: 0;

            z-index: 110;

            display: flex;

            align-items: center;
            justify-content: center;

            background:
                rgba(5,7,11,0.92);

            backdrop-filter:
                blur(8px);

            -webkit-backdrop-filter:
                blur(8px);

            transition:
                opacity 0.25s ease;
        }

        #iframeLoader.hidden {

            opacity: 0;

            pointer-events: none;
        }


        /* USER PROVIDED LOADER */

        .loading-wave {

            width: 300px;
            height: 100px;

            display: flex;

            justify-content: center;
            align-items: flex-end;
        }

        .loading-bar {

            width: 20px;
            height: 10px;

            margin: 0 5px;

            background-color:
                #3498db;

            border-radius: 5px;

            animation:
                loading-wave-animation
                1s ease-in-out infinite;
        }

        .loading-bar:nth-child(2) {
            animation-delay: 0.1s;
        }

        .loading-bar:nth-child(3) {
            animation-delay: 0.2s;
        }

        .loading-bar:nth-child(4) {
            animation-delay: 0.3s;
        }

        @keyframes loading-wave-animation {

            0% {
                height: 10px;
            }

            50% {
                height: 50px;
            }

            100% {
                height: 10px;
            }
        }


        /* =========================================================
           EMPTY STATE
           ========================================================= */

        .empty-state {

            grid-column:
                1 / -1;

            min-height: 260px;

            border:
                1px dashed rgba(255,255,255,0.1);

            border-radius:
                var(--radius);

            display: flex;
            align-items: center;
            justify-content: center;

            color:
                var(--muted);

            text-align: center;
        }


        /* =========================================================
           ANIMATIONS
           ========================================================= */

        @keyframes cardAppear {

            from {
                opacity: 0;
                transform:
                    translateY(18px)
                    scale(0.98);
            }

            to {
                opacity: 1;
                transform:
                    translateY(0)
                    scale(1);
            }
        }

        @keyframes viewerIn {

            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }


        /* =========================================================
           MOBILE
           ========================================================= */

        @media (max-width: 1000px) {

            #bentoGrid {
                grid-template-columns:
                    repeat(3, minmax(0, 1fr));
            }

        }


        @media (max-width: 720px) {

            :root {
                --header-height: 66px;
                --radius: 19px;
            }

            .topbar {
                padding:
                    0 15px;
            }

            .brand-logo {
                width: 37px;
                height: 37px;
            }

            .brand-name {
                font-size: 18px;
            }

            .brand-subtitle {
                display: none;
            }

            .header-actions .icon-button:nth-child(2) {
                display: none;
            }

            .main-content {
                padding:
                    25px
                    15px
                    45px;
            }

            .hero {
                margin-bottom: 22px;
            }

            .hero h1 {
                letter-spacing: -1.8px;
            }

            #bentoGrid {

                grid-template-columns:
                    repeat(2, minmax(0, 1fr));

                gap: 11px;
            }

            .app-card {

                min-height: 165px;

                padding: 17px;

                border-radius:
                    19px;
            }

            .app-card.large,
            .app-card.wide,
            .app-card.tall {

                grid-column: span 1;
                grid-row: span 1;
            }

            .app-card.large {
                grid-column: span 2;
            }

            .app-logo {
                width: 43px;
                height: 43px;
            }

            .card-title {
                font-size: 15px;
            }

            .card-description {
                font-size: 11px;
            }

            .hover-text {
                display: none;
            }

            .viewer-toolbar {

                top: auto;
                bottom: 14px;

                height: 52px;
            }

        }


        @media (max-width: 420px) {

            #bentoGrid {
                grid-template-columns:
                    1fr 1fr;
            }

            .app-card {
                min-height: 150px;
                padding: 15px;
            }

            .card-description {
                max-width: 100%;
            }

            .viewer-button {
                width: 38px;
                height: 38px;
            }

        }

    </style>
</head>


<body>

<div id="app">


    <!-- =========================================================
         DASHBOARD
         ========================================================= -->

    <section id="dashboard">

        <header class="topbar">

            <div class="brand">

                <img
                    class="brand-logo"
                    src="https://i.ibb.co/kgzJb34B/horizon-logo.png"
                    alt="Horizon"
                >

                <div>

                    <div class="brand-name">
                        Horizon
                    </div>

                    <div class="brand-subtitle">
                        Your digital workspace
                    </div>

                </div>

            </div>


            <div class="header-actions">

                <button
                    class="icon-button"
                    onclick="scrollToTop()"
                    title="Home"
                    aria-label="Home"
                >
                    ⌂
                </button>

                <button
                    class="icon-button"
                    onclick="reloadDashboard()"
                    title="Refresh"
                    aria-label="Refresh"
                >
                    ↻
                </button>

            </div>

        </header>


        <main class="main-content">


            <div class="hero">

                <div class="hero-label">
                    Horizon Workspace
                </div>

                <h1>
                    Everything.
                    <span>In one place.</span>
                </h1>

                <p>
                    Access your frequently used websites and applications
                    from one clean, fast and modern workspace.
                </p>

            </div>


            <!-- BENTO GRID -->

            <div id="bentoGrid"></div>


        </main>

    </section>



    <!-- =========================================================
         IFRAME VIEWER
         ========================================================= -->

    <section id="viewer">

        <div class="viewer-toolbar">

            <button
                class="viewer-button"
                onclick="goBack()"
                title="Back to Horizon"
                aria-label="Back"
            >
                ←
            </button>

            <button
                class="viewer-button"
                onclick="reloadIframe()"
                title="Reload"
                aria-label="Reload"
            >
                ↻
            </button>

            <button
                class="viewer-button"
                onclick="openExternal()"
                title="Open in new tab"
                aria-label="Open in new tab"
            >
                ↗
            </button>

            <button
                class="viewer-button close"
                onclick="goBack()"
                title="Close"
                aria-label="Close"
            >
                ×
            </button>

        </div>


        <!-- Loader -->

        <div id="iframeLoader">

            <div class="loading-wave">

                <div class="loading-bar"></div>
                <div class="loading-bar"></div>
                <div class="loading-bar"></div>
                <div class="loading-bar"></div>

            </div>

        </div>


        <!-- Website -->

        <iframe
            id="siteFrame"
            title="Horizon Website Viewer"
            allowfullscreen
        ></iframe>

    </section>

</div>


<script>

    /* =========================================================
       HORIZON CONFIGURATION
       ========================================================= */


    /*
        ADD YOUR CARDS HERE.

        STRUCTURE:

        {
            iframeLink: "https://example.com",
            logo: "https://example.com/logo.png",

            description:
                "Short description of this application.",

            enabled: 1,

            hoverText:
                "Open application",

            size: "normal"
        }


        SIZE OPTIONS:

        normal
        wide
        tall
        large

    */


    const horizonApps = [

        {
            iframeLink: "https://example.com",

            logo:
                "https://i.ibb.co/kgzJb34B/horizon-logo.png",

            description:
                "Example application. Replace this with your website.",

            enabled: 1,

            hoverText:
                "Open application",

            size:
                "large"
        },


        {
            iframeLink: "https://www.google.com",

            logo:
                "https://www.google.com/favicon.ico",

            description:
                "Search the web quickly from Horizon.",

            enabled: 1,

            hoverText:
                "Open Google",

            size:
                "normal"
        },


        {
            iframeLink: "https://github.com",

            logo:
                "https://github.githubassets.com/favicons/favicon.png",

            description:
                "Manage repositories, projects and code.",

            enabled: 1,

            hoverText:
                "Open GitHub",

            size:
                "wide"
        },


        {
            iframeLink: "https://mail.google.com",

            logo:
                "https://ssl.gstatic.com/ui/v1/icons/mail/rfr/gmail.ico",

            description:
                "Access your email and communication.",

            enabled: 1,

            hoverText:
                "Open Gmail",

            size:
                "normal"
        },


        {
            iframeLink: "https://drive.google.com",

            logo:
                "https://ssl.gstatic.com/images/branding/product/2x/drive_2020q4_48dp.png",

            description:
                "Access your cloud files and documents.",

            enabled: 1,

            hoverText:
                "Open Drive",

            size:
                "tall"
        },


        {
            iframeLink: "https://calendar.google.com",

            logo:
                "https://ssl.gstatic.com/calendar/images/dynamiclogo_2020q4/calendar_31_2x.png",

            description:
                "Manage schedules, meetings and events.",

            enabled: 1,

            hoverText:
                "Open Calendar",

            size:
                "normal"
        }

    ];



    /* =========================================================
       ELEMENTS
       ========================================================= */

    const grid =
        document.getElementById("bentoGrid");

    const dashboard =
        document.getElementById("dashboard");

    const viewer =
        document.getElementById("viewer");

    const iframe =
        document.getElementById("siteFrame");

    const loader =
        document.getElementById("iframeLoader");



    let currentApp = null;



    /* =========================================================
       SAFE TEXT
       ========================================================= */

    function escapeHTML(value) {

        if (value === null || value === undefined) {
            return "";
        }

        return String(value)
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");
    }



    /* =========================================================
       CREATE CARDS
       ========================================================= */

    function renderApps() {

        grid.innerHTML = "";

        const enabledApps =
            horizonApps.filter(
                app => Number(app.enabled) === 1
            );


        if (!enabledApps.length) {

            grid.innerHTML = `
                <div class="empty-state">
                    No applications are currently enabled.
                </div>
            `;

            return;
        }


        enabledApps.forEach(
            (app, index) => {

                const card =
                    document.createElement("article");

                card.className =
                    `app-card ${app.size || "normal"}`;


                card.style.animationDelay =
                    `${index * 45}ms`;


                const logo =
                    app.logo ||
                    "https://i.ibb.co/kgzJb34B/horizon-logo.png";


                card.innerHTML = `

                    <div class="card-glow"></div>

                    <div>

                        <div class="card-top">

                            <img
                                class="app-logo"
                                src="${escapeHTML(logo)}"
                                alt=""
                                loading="lazy"
                                onerror="
                                    this.src='https://i.ibb.co/kgzJb34B/horizon-logo.png'
                                "
                            >

                            <span
                                class="status-dot"
                                title="Enabled"
                            ></span>

                        </div>


                        <div class="card-content">

                            <div class="card-title">
                                ${escapeHTML(
                                    getAppName(app)
                                )}
                            </div>

                            <div class="card-description">
                                ${escapeHTML(
                                    app.description
                                )}
                            </div>

                        </div>

                    </div>


                    <div class="hover-text">
                        ${escapeHTML(
                            app.hoverText ||
                            "Open application"
                        )}
                        &nbsp; →
                    </div>
                `;


                card.addEventListener(
                    "click",
                    () => openApp(app)
                );


                grid.appendChild(card);

            }
        );

    }



    /* =========================================================
       APP NAME
       ========================================================= */

    function getAppName(app) {

        /*
            Optional:

            Add:

            name: "My Website"

            to your card.

            If name is not provided,
            the hostname will be used.
        */

        if (app.name) {
            return app.name;
        }


        try {

            const url =
                new URL(app.iframeLink);

            return url.hostname
                .replace(/^www\./, "")
                .split(".")[0]
                .replace(
                    /^./,
                    c => c.toUpperCase()
                );

        } catch {

            return "Application";

        }

    }



    /* =========================================================
       OPEN APP
       ========================================================= */

    function openApp(app) {

        if (!app || !app.iframeLink) {
            return;
        }


        currentApp = app;


        /*
            Show viewer
        */

        dashboard.classList.add("hidden");

        viewer.classList.add("active");


        /*
            Show loader
        */

        loader.classList.remove("hidden");


        /*
            Remove old iframe content
        */

        iframe.src = "about:blank";


        /*
            Small delay prevents visual flashing
        */

        setTimeout(
            () => {

                iframe.src =
                    app.iframeLink;

            },
            80
        );


        /*
            Update browser history

            Allows browser back button
            to return to Horizon.
        */

        history.pushState(
            {
                horizonViewer: true
            },
            "",
            "#app"
        );

    }



    /* =========================================================
       IFRAME LOADED
       ========================================================= */

    iframe.addEventListener(
        "load",
        () => {

            /*
                Give the website a tiny amount
                of time to render.
            */

            setTimeout(
                () => {

                    loader.classList.add("hidden");

                },
                250
            );

        }
    );



    /* =========================================================
       BACK
       ========================================================= */

    function goBack() {

        iframe.src =
            "about:blank";


        viewer.classList.remove(
            "active"
        );


        dashboard.classList.remove(
            "hidden"
        );


        currentApp = null;


        if (
            location.hash === "#app"
        ) {

            history.replaceState(
                null,
                "",
                location.pathname +
                location.search
            );

        }

    }



    /* =========================================================
       BROWSER BACK BUTTON
       ========================================================= */

    window.addEventListener(
        "popstate",
        () => {

            if (
                viewer.classList.contains(
                    "active"
                )
            ) {

                goBack();

            }

        }
    );



    /* =========================================================
       ESC KEY
       ========================================================= */

    document.addEventListener(
        "keydown",
        event => {

            if (
                event.key === "Escape" &&
                viewer.classList.contains(
                    "active"
                )
            ) {

                goBack();

            }

        }
    );



    /* =========================================================
       RELOAD IFRAME
       ========================================================= */

    function reloadIframe() {

        if (!currentApp) {
            return;
        }


        loader.classList.remove(
            "hidden"
        );


        /*
            Reload using current URL
        */

        iframe.src =
            currentApp.iframeLink;

    }



    /* =========================================================
       OPEN EXTERNAL
       ========================================================= */

    function openExternal() {

        if (
            !currentApp ||
            !currentApp.iframeLink
        ) {
            return;
        }


        window.open(
            currentApp.iframeLink,
            "_blank",
            "noopener,noreferrer"
        );

    }



    /* =========================================================
       SCROLL TOP
       ========================================================= */

    function scrollToTop() {

        dashboard.scrollTo({
            top: 0,
            behavior: "smooth"
        });

    }



    /* =========================================================
       REFRESH DASHBOARD
       ========================================================= */

    function reloadDashboard() {

        renderApps();

    }



    /* =========================================================
       START HORIZON
       ========================================================= */

    renderApps();


</script>

</body>
</html>
