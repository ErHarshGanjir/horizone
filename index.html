<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <title>Horizon</title>

    <link
        rel="icon"
        type="image/png"
        href="https://i.ibb.co/kgzJb34B/horizon-logo.png"
    >

    <meta
        name="theme-color"
        content="#080b12"
    >


    <style>

        /* =====================================================
           HORIZON
           GLOBAL VARIABLES
           ===================================================== */

        :root {

            --bg: #080b12;

            --card:
                rgba(18, 23, 34, 0.82);

            --card-hover:
                rgba(27, 34, 49, 0.96);

            --border:
                rgba(255, 255, 255, 0.08);

            --border-hover:
                rgba(255, 255, 255, 0.16);

            --text:
                #f4f7fb;

            --muted:
                #8c96a8;

            --accent:
                #3498db;

            --accent-light:
                #8fcfff;

            --accent-soft:
                rgba(52, 152, 219, 0.14);

            --success:
                #42d17d;

            --danger:
                #ff5f6d;

            --radius:
                24px;

        }


        /* =====================================================
           RESET
           ===================================================== */

        * {

            box-sizing:
                border-box;

            margin:
                0;

            padding:
                0;

        }


        html,
        body {

            width:
                100%;

            min-height:
                100%;

        }


        body {

            font-family:

                Inter,
                ui-sans-serif,
                system-ui,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;

            color:
                var(--text);

            background:

                radial-gradient(
                    circle at 10% 0%,
                    rgba(52, 152, 219, 0.09),
                    transparent 30%
                ),

                radial-gradient(
                    circle at 90% 10%,
                    rgba(113, 76, 255, 0.08),
                    transparent 30%
                ),

                var(--bg);

            overflow-x:
                hidden;

        }


        button,
        input {

            font-family:
                inherit;

        }


        button {

            -webkit-tap-highlight-color:
                transparent;

        }


        /* =====================================================
           DASHBOARD
           ===================================================== */

        #dashboard {

            width:
                100%;

            min-height:
                100vh;

            transition:

                opacity 0.3s ease,

                transform 0.3s ease;

        }


        #dashboard.hidden {

            opacity:
                0;

            pointer-events:
                none;

            transform:
                scale(0.985);

        }


        /* =====================================================
           MAIN CONTENT
           ===================================================== */

        .main-content {

            width:
                min(1450px, 100%);

            margin:
                0 auto;

            padding:

                45px
                clamp(18px, 5vw, 55px)
                70px;

        }


        /* =====================================================
           HORIZON LOGO
           ===================================================== */

        .home-brand {

            display:
                flex;

            flex-direction:
                column;

            align-items:
                center;

            justify-content:
                center;

            padding:

                20px
                10px
                25px;

            user-select:
                none;

        }


        .home-logo {

            width:
                clamp(120px, 14vw, 185px);

            height:
                clamp(120px, 14vw, 185px);

            object-fit:
                contain;

            margin-bottom:
                18px;

            filter:

                drop-shadow(
                    0 18px 35px
                    rgba(0, 0, 0, 0.35)
                );

            animation:
                logoAppear 0.65s ease both;

        }


        /* =====================================================
           HERO
           ===================================================== */

        .hero {

            text-align:
                center;

            margin:

                0 auto
                35px;

            animation:
                heroAppear 0.6s ease both;

        }


        .hero h1 {

            font-size:
                clamp(32px, 5vw, 60px);

            line-height:
                1;

            letter-spacing:
                -2.8px;

            font-weight:
                800;

            margin-bottom:
                14px;

        }


        .hero h1 span {

            color:
                var(--accent-light);

        }


        .hero p {

            max-width:
                650px;

            margin:
                0 auto;

            color:
                var(--muted);

            font-size:
                clamp(13px, 1.5vw, 15px);

            line-height:
                1.6;

        }


        @keyframes logoAppear {

            from {

                opacity:
                    0;

                transform:
                    translateY(15px)
                    scale(0.92);

            }

            to {

                opacity:
                    1;

                transform:
                    translateY(0)
                    scale(1);

            }

        }


        @keyframes heroAppear {

            from {

                opacity:
                    0;

                transform:
                    translateY(10px);

            }

            to {

                opacity:
                    1;

                transform:
                    translateY(0);

            }

        }


        /* =====================================================
           SECTION HEADER
           ===================================================== */

        .section-header {

            display:
                flex;

            align-items:
                center;

            justify-content:
                space-between;

            margin-bottom:
                16px;

        }


        .section-title {

            font-size:
                14px;

            font-weight:
                750;

            letter-spacing:
                -0.2px;

        }


        .section-count {

            color:
                var(--muted);

            font-size:
                11px;

        }


        /* =====================================================
           BENTO GRID
           ===================================================== */

        #bentoGrid {

            display:
                grid;

            grid-template-columns:
                repeat(4, minmax(0, 1fr));

            grid-auto-rows:
                minmax(180px, auto);

            gap:
                16px;

        }


        /* =====================================================
           APPLICATION CARD
           ===================================================== */

        .app-card {

            position:
                relative;

            min-height:
                190px;

            overflow:
                hidden;

            padding:
                22px;

            border:
                1px solid var(--border);

            border-radius:
                var(--radius);

            background:

                linear-gradient(
                    145deg,
                    rgba(255,255,255,0.045),
                    rgba(255,255,255,0.018)
                ),

                var(--card);

            cursor:
                pointer;

            display:
                flex;

            flex-direction:
                column;

            justify-content:
                space-between;

            transition:

                transform 0.28s
                cubic-bezier(.2,.8,.2,1),

                border-color 0.28s ease,

                background 0.28s ease,

                box-shadow 0.28s ease;

            animation:
                cardAppear 0.5s ease both;

        }


        .app-card:hover {

            transform:
                translateY(-5px)
                scale(1.008);

            border-color:
                var(--border-hover);

            background:

                linear-gradient(
                    145deg,
                    rgba(255,255,255,0.075),
                    rgba(255,255,255,0.025)
                ),

                var(--card-hover);

            box-shadow:

                0 20px 50px
                rgba(0,0,0,0.28);

        }


        .app-card:active {

            transform:
                scale(0.985);

        }


        /* =====================================================
           CARD SIZES
           ===================================================== */

        .app-card.large {

            grid-column:
                span 2;

            grid-row:
                span 2;

        }


        .app-card.wide {

            grid-column:
                span 2;

        }


        .app-card.tall {

            grid-row:
                span 2;

        }


        /* =====================================================
           DISABLED CARD
           ===================================================== */

        .app-card.disabled {

            cursor:
                not-allowed;

            opacity:
                0.52;

            filter:
                saturate(0.45);

        }


        .app-card.disabled:hover {

            transform:
                none;

            background:

                linear-gradient(
                    145deg,
                    rgba(255,255,255,0.035),
                    rgba(255,255,255,0.015)
                ),

                var(--card);

            border-color:
                var(--border);

            box-shadow:
                none;

        }


        .app-card.disabled:active {

            transform:
                none;

        }


        .app-card.disabled .card-glow {

            display:
                none;

        }


        /* =====================================================
           CARD GLOW
           ===================================================== */

        .card-glow {

            position:
                absolute;

            width:
                180px;

            height:
                180px;

            right:
                -80px;

            bottom:
                -100px;

            border-radius:
                50%;

            background:

                radial-gradient(
                    circle,
                    rgba(52,152,219,0.16),
                    transparent 70%
                );

            pointer-events:
                none;

            transition:
                transform 0.4s ease;

        }


        .app-card:hover
        .card-glow {

            transform:
                scale(1.5);

        }


        /* =====================================================
           CARD TOP
           ===================================================== */

        .card-top {

            display:
                flex;

            align-items:
                flex-start;

            justify-content:
                space-between;

        }


        .app-logo {

            width:
                50px;

            height:
                50px;

            object-fit:
                contain;

            padding:
                8px;

            border-radius:
                15px;

            background:
                rgba(255,255,255,0.06);

            border:
                1px solid
                rgba(255,255,255,0.07);

        }


        .card-status {

            display:
                flex;

            align-items:
                center;

            gap:
                7px;

        }


        .status-dot {

            width:
                8px;

            height:
                8px;

            border-radius:
                50%;

            background:
                var(--success);

            box-shadow:

                0 0 12px
                rgba(66,209,125,0.65);

        }


        .lock-icon {

            font-size:
                12px;

            opacity:
                0.65;

        }


        .disabled-status {

            padding:
                4px 8px;

            border-radius:
                999px;

            background:
                rgba(255,255,255,0.06);

            border:
                1px solid
                rgba(255,255,255,0.08);

            color:
                var(--muted);

            font-size:
                9px;

            font-weight:
                700;

            text-transform:
                uppercase;

            letter-spacing:
                0.4px;

        }


        /* =====================================================
           CARD CONTENT
           ===================================================== */

        .card-content {

            margin-top:
                20px;

        }


        .card-title {

            font-size:
                18px;

            font-weight:
                750;

            letter-spacing:
                -0.4px;

            margin-bottom:
                7px;

        }


        .card-description {

            color:
                var(--muted);

            font-size:
                12px;

            line-height:
                1.55;

            max-width:
                90%;

        }


        /* =====================================================
           HOVER TEXT
           ===================================================== */

        .hover-text {

            position:
                absolute;

            left:
                22px;

            bottom:
                18px;

            color:
                #91d4ff;

            font-size:
                11px;

            font-weight:
                650;

            opacity:
                0;

            transform:
                translateY(7px);

            transition:

                opacity 0.25s ease,

                transform 0.25s ease;

        }


        .app-card:hover
        .hover-text {

            opacity:
                1;

            transform:
                translateY(0);

        }


        .app-card.disabled
        .hover-text {

            opacity:
                0;

        }


        /* =====================================================
           IMPORTANT LINKS
           ===================================================== */

        .important-section {

            margin-top:
                60px;

        }


        .important-links {

            display:
                grid;

            grid-template-columns:
                repeat(3, minmax(0,1fr));

            gap:
                12px;

        }


        .important-link {

            border:
                1px solid var(--border);

            background:
                rgba(255,255,255,0.025);

            border-radius:
                17px;

            padding:
                15px 16px;

            display:
                flex;

            align-items:
                center;

            justify-content:
                space-between;

            gap:
                12px;

            transition:
                0.2s ease;

        }


        .important-link:hover {

            background:
                rgba(255,255,255,0.055);

            border-color:
                var(--border-hover);

        }


        .important-info {

            min-width:
                0;

        }


        .important-name {

            font-size:
                13px;

            font-weight:
                700;

            margin-bottom:
                5px;

        }


        .important-url {

            color:
                var(--muted);

            font-size:
                11px;

            white-space:
                nowrap;

            overflow:
                hidden;

            text-overflow:
                ellipsis;

            max-width:
                300px;

        }


        .important-actions {

            display:
                flex;

            gap:
                6px;

            flex-shrink:
                0;

        }


        .link-button {

            height:
                34px;

            padding:
                0 11px;

            border-radius:
                10px;

            border:
                1px solid
                rgba(255,255,255,0.08);

            background:
                rgba(255,255,255,0.045);

            color:
                #dfe5ef;

            cursor:
                pointer;

            font-size:
                11px;

            font-weight:
                650;

            transition:
                0.2s ease;

        }


        .link-button:hover {

            background:
                rgba(255,255,255,0.10);

        }


        .link-button.open {

            background:
                var(--accent-soft);

            color:
                #8ed3ff;

            border-color:
                rgba(52,152,219,0.18);

        }


        .copy-success {

            color:
                var(--success) !important;

        }


        /* =====================================================
           FOOTER
           ===================================================== */

        .footer {

            margin-top:
                55px;

            text-align:
                center;

            color:
                rgba(255,255,255,0.28);

            font-size:
                10px;

        }


        /* =====================================================
           FULL-SCREEN IFRAME
           NO TOOLBAR
           NO OVERLAY BUTTONS
           ===================================================== */

        #viewer {

            position:
                fixed;

            inset:
                0;

            z-index:
                1000;

            display:
                none;

            width:
                100vw;

            height:
                100vh;

            background:
                #ffffff;

            opacity:
                0;

        }


        #viewer.active {

            display:
                block;

            animation:
                viewerIn 0.25s ease forwards;

        }


        #viewer iframe {

            display:
                block;

            width:
                100vw;

            height:
                100vh;

            min-width:
                100vw;

            min-height:
                100vh;

            border:
                0;

            margin:
                0;

            padding:
                0;

            background:
                #ffffff;

        }


        @keyframes viewerIn {

            from {

                opacity:
                    0;

            }

            to {

                opacity:
                    1;

            }

        }


        /* =====================================================
           LOADER
           ===================================================== */

        #iframeLoader {

            position:
                fixed;

            inset:
                0;

            z-index:
                1100;

            display:
                flex;

            align-items:
                center;

            justify-content:
                center;

            background:
                rgba(5,7,11,0.94);

            backdrop-filter:
                blur(8px);

            -webkit-backdrop-filter:
                blur(8px);

            transition:
                opacity 0.25s ease;

        }


        #iframeLoader.hidden {

            opacity:
                0;

            pointer-events:
                none;

        }


        /* =====================================================
           LOADING WAVE
           ===================================================== */

        .loading-wave {

            width:
                300px;

            height:
                100px;

            display:
                flex;

            justify-content:
                center;

            align-items:
                flex-end;

        }


        .loading-bar {

            width:
                20px;

            height:
                10px;

            margin:
                0 5px;

            background-color:
                #3498db;

            border-radius:
                5px;

            animation:
                loading-wave-animation
                1s ease-in-out infinite;

        }


        .loading-bar:nth-child(2) {

            animation-delay:
                0.1s;

        }


        .loading-bar:nth-child(3) {

            animation-delay:
                0.2s;

        }


        .loading-bar:nth-child(4) {

            animation-delay:
                0.3s;

        }


        @keyframes loading-wave-animation {

            0% {

                height:
                    10px;

            }

            50% {

                height:
                    50px;

            }

            100% {

                height:
                    10px;

            }

        }


        /* =====================================================
           PASSWORD MODAL
           ===================================================== */

        #passwordModal {

            position:
                fixed;

            inset:
                0;

            z-index:
                3000;

            display:
                flex;

            align-items:
                center;

            justify-content:
                center;

            padding:
                20px;

            background:
                rgba(3,5,9,0.72);

            backdrop-filter:
                blur(18px);

            -webkit-backdrop-filter:
                blur(18px);

            opacity:
                0;

            visibility:
                hidden;

            pointer-events:
                none;

            transition:

                opacity 0.25s ease,

                visibility 0.25s ease;

        }


        #passwordModal.active {

            opacity:
                1;

            visibility:
                visible;

            pointer-events:
                auto;

        }


        .password-box {

            width:
                min(410px,100%);

            padding:
                28px;

            border-radius:
                25px;

            border:
                1px solid
                rgba(255,255,255,0.10);

            background:

                linear-gradient(
                    145deg,
                    rgba(28,34,48,0.97),
                    rgba(13,17,26,0.97)
                );

            box-shadow:

                0 30px 100px
                rgba(0,0,0,0.5);

            transform:
                translateY(12px)
                scale(0.97);

            transition:
                transform 0.25s ease;

        }


        #passwordModal.active
        .password-box {

            transform:
                translateY(0)
                scale(1);

        }


        .password-icon {

            width:
                48px;

            height:
                48px;

            border-radius:
                15px;

            display:
                flex;

            align-items:
                center;

            justify-content:
                center;

            background:
                var(--accent-soft);

            border:
                1px solid
                rgba(52,152,219,0.15);

            font-size:
                20px;

            margin-bottom:
                18px;

        }


        .password-title {

            font-size:
                20px;

            font-weight:
                800;

            margin-bottom:
                7px;

        }


        .password-description {

            color:
                var(--muted);

            font-size:
                12px;

            line-height:
                1.5;

            margin-bottom:
                20px;

        }


        #passwordInput {

            width:
                100%;

            height:
                48px;

            border-radius:
                13px;

            border:
                1px solid
                rgba(255,255,255,0.10);

            outline:
                none;

            background:
                rgba(255,255,255,0.045);

            color:
                white;

            padding:
                0 15px;

            font-size:
                14px;

            transition:

                border 0.2s ease,

                background 0.2s ease;

        }


        #passwordInput:focus {

            border-color:
                rgba(52,152,219,0.5);

            background:
                rgba(255,255,255,0.065);

        }


        #passwordInput.error {

            border-color:
                rgba(255,95,109,0.65);

            animation:
                shake 0.25s ease;

        }


        .password-error {

            min-height:
                17px;

            margin-top:
                8px;

            color:
                #ff7c87;

            font-size:
                11px;

        }


        .password-actions {

            display:
                flex;

            gap:
                8px;

            margin-top:
                13px;

        }


        .password-button {

            height:
                44px;

            flex:
                1;

            border-radius:
                12px;

            border:
                1px solid
                rgba(255,255,255,0.08);

            background:
                rgba(255,255,255,0.05);

            color:
                #e7ebf3;

            cursor:
                pointer;

            font-weight:
                700;

            transition:
                0.2s ease;

        }


        .password-button:hover {

            background:
                rgba(255,255,255,0.10);

        }


        .password-button.primary {

            background:
                #3498db;

            border-color:
                #3498db;

            color:
                white;

        }


        .password-button.primary:hover {

            background:
                #2789c7;

        }


        @keyframes shake {

            0%,
            100% {

                transform:
                    translateX(0);

            }

            25% {

                transform:
                    translateX(-5px);

            }

            75% {

                transform:
                    translateX(5px);

            }

        }


        /* =====================================================
           EMPTY STATE
           ===================================================== */

        .empty-state {

            grid-column:
                1 / -1;

            min-height:
                250px;

            border:
                1px dashed
                rgba(255,255,255,0.10);

            border-radius:
                var(--radius);

            display:
                flex;

            align-items:
                center;

            justify-content:
                center;

            color:
                var(--muted);

        }


        /* =====================================================
           CARD ANIMATION
           ===================================================== */

        @keyframes cardAppear {

            from {

                opacity:
                    0;

                transform:
                    translateY(18px)
                    scale(0.98);

            }

            to {

                opacity:
                    1;

                transform:
                    translateY(0)
                    scale(1);

            }

        }


        /* =====================================================
           TABLET
           ===================================================== */

        @media (max-width: 1000px) {

            #bentoGrid {

                grid-template-columns:
                    repeat(3, minmax(0,1fr));

            }


            .important-links {

                grid-template-columns:
                    repeat(2, minmax(0,1fr));

            }

        }


        /* =====================================================
           MOBILE
           ===================================================== */

        @media (max-width: 720px) {

            .main-content {

                padding:

                    25px
                    15px
                    50px;

            }


            .home-brand {

                padding:

                    20px
                    10px
                    25px;

            }


            .hero {

                margin-bottom:
                    25px;

            }


            .hero h1 {

                letter-spacing:
                    -1.8px;

            }


            #bentoGrid {

                grid-template-columns:
                    repeat(2, minmax(0,1fr));

                gap:
                    11px;

            }


            .app-card {

                min-height:
                    165px;

                padding:
                    17px;

                border-radius:
                    19px;

            }


            .app-card.large,
            .app-card.wide,
            .app-card.tall {

                grid-column:
                    span 1;

                grid-row:
                    span 1;

            }


            .app-card.large {

                grid-column:
                    span 2;

            }


            .app-logo {

                width:
                    43px;

                height:
                    43px;

            }


            .card-title {

                font-size:
                    15px;

            }


            .card-description {

                font-size:
                    11px;

            }


            .hover-text {

                display:
                    none;

            }


            .important-section {

                margin-top:
                    40px;

            }


            .important-links {

                grid-template-columns:
                    1fr;

            }


            .important-link {

                padding:
                    13px;

            }


            .important-url {

                max-width:
                    200px;

            }


            #viewer,
            #viewer iframe {

                width:
                    100vw;

                height:
                    100vh;

            }

        }


        /* =====================================================
           SMALL MOBILE
           ===================================================== */

        @media (max-width: 420px) {

            .app-card {

                min-height:
                    150px;

                padding:
                    15px;

            }


            .important-actions {

                gap:
                    4px;

            }


            .link-button {

                padding:
                    0 9px;

            }

        }

    </style>

</head>


<body>


<!-- =========================================================
     HORIZON DASHBOARD
     ========================================================= -->

<div id="dashboard">

    <main class="main-content">


        <!-- =====================================================
             HORIZON LOGO
             ===================================================== -->

        <section class="home-brand">

            <img
                class="home-logo"
                src="https://i.ibb.co/kgzJb34B/horizon-logo.png"
                alt="Horizon"
            >

        </section>


        <!-- =====================================================
             MAIN HERO
             ===================================================== -->

        <section class="hero">

            <h1>

                Everything.
                <span>In one place.</span>

            </h1>


            <p>

                Access your frequently used websites
                and applications from one clean, fast
                and modern workspace.

            </p>

        </section>


        <!-- =====================================================
             APPLICATIONS HEADER
             ===================================================== -->

        <div class="section-header">

            <div class="section-title">

                Applications

            </div>


            <div
                class="section-count"
                id="appCount"
            ></div>

        </div>


        <!-- =====================================================
             BENTO GRID
             ===================================================== -->

        <div id="bentoGrid"></div>


        <!-- =====================================================
             IMPORTANT LINKS
             ===================================================== -->

        <section class="important-section">

            <div class="section-header">

                <div class="section-title">

                    Important Links

                </div>


                <div class="section-count">

                    Quick access

                </div>

            </div>


            <div
                class="important-links"
                id="importantLinks"
            ></div>

        </section>


        <!-- =====================================================
             FOOTER
             ===================================================== -->

        <div class="footer">

            Horizon Workspace

        </div>


    </main>

</div>



<!-- =========================================================
     FULL SCREEN IFRAME VIEWER
     ========================================================= -->

<div id="viewer">


    <!-- =====================================================
         LOADER
         ===================================================== -->

    <div id="iframeLoader">

        <div class="loading-wave">

            <div class="loading-bar"></div>

            <div class="loading-bar"></div>

            <div class="loading-bar"></div>

            <div class="loading-bar"></div>

        </div>

    </div>


    <!-- =====================================================
         IFRAME
         NO BUTTONS / NO TOOLBAR
         ===================================================== -->

    <iframe
        id="siteFrame"
        title="Horizon Website Viewer"
        allowfullscreen
    ></iframe>


</div>



<!-- =========================================================
     PASSWORD MODAL
     ========================================================= -->

<div id="passwordModal">


    <div class="password-box">


        <div class="password-icon">

            🔒

        </div>


        <div class="password-title">

            Password Required

        </div>


        <div class="password-description">

            This application is protected.
            Enter the password to continue.

        </div>


        <input
            type="password"
            id="passwordInput"
            placeholder="Enter password"
            autocomplete="off"
        >


        <div
            class="password-error"
            id="passwordError"
        ></div>


        <div class="password-actions">


            <button
                class="password-button"
                onclick="cancelPassword()"
            >

                Cancel

            </button>


            <button
                class="password-button primary"
                onclick="submitPassword()"
            >

                Continue

            </button>


        </div>


    </div>

</div>



<!-- =========================================================
     IMPORTANT:
     LOAD DATA FILES BEFORE MAIN JAVASCRIPT
     ========================================================= -->

<script src="horizonApps.js"></script>

<script src="importantLinks.js"></script>



<script>

    /* =========================================================
       HORIZON MAIN APPLICATION
       ========================================================= */


    /* =========================================================
       CHECK DATA FILES
       ========================================================= */

    if (
        typeof horizonApps ===
        "undefined"
    ) {

        console.error(
            "Horizon Error: horizonApps.js was not loaded."
        );

    }


    if (
        typeof importantLinks ===
        "undefined"
    ) {

        console.error(
            "Horizon Error: importantLinks.js was not loaded."
        );

    }


    /* =========================================================
       DOM ELEMENTS
       ========================================================= */

    const grid =
        document.getElementById(
            "bentoGrid"
        );


    const appCount =
        document.getElementById(
            "appCount"
        );


    const importantLinksContainer =
        document.getElementById(
            "importantLinks"
        );


    const dashboard =
        document.getElementById(
            "dashboard"
        );


    const viewer =
        document.getElementById(
            "viewer"
        );


    const iframe =
        document.getElementById(
            "siteFrame"
        );


    const loader =
        document.getElementById(
            "iframeLoader"
        );


    const passwordModal =
        document.getElementById(
            "passwordModal"
        );


    const passwordInput =
        document.getElementById(
            "passwordInput"
        );


    const passwordError =
        document.getElementById(
            "passwordError"
        );


    /* =========================================================
       CURRENT STATE
       ========================================================= */

    let currentApp =
        null;


    let pendingApp =
        null;


    /* =========================================================
       ESCAPE HTML
       ========================================================= */

    function escapeHTML(value) {

        if (
            value === null ||
            value === undefined
        ) {

            return "";

        }


        return String(value)

            .replace(
                /&/g,
                "&amp;"
            )

            .replace(
                /</g,
                "&lt;"
            )

            .replace(
                />/g,
                "&gt;"
            )

            .replace(
                /"/g,
                "&quot;"
            )

            .replace(
                /'/g,
                "&#039;"
            );

    }


    /* =========================================================
       GET APP NAME
       ========================================================= */

    function getAppName(app) {

        if (
            app.name
        ) {

            return app.name;

        }


        try {

            const url =
                new URL(
                    app.iframeLink
                );


            return url.hostname

                .replace(
                    /^www\./,
                    ""
                )

                .split(".")[0]

                .replace(
                    /^./,
                    character =>
                        character.toUpperCase()
                );

        }

        catch {

            return "Application";

        }

    }


    /* =========================================================
       PASSWORD CHECK
       ========================================================= */

    function hasPassword(app) {

        if (!app) {

            return false;

        }


        /*
            STRING PASSWORD
        */

        if (
            typeof app.password ===
            "string"
        ) {

            return (
                app.password.trim() !== ""
            );

        }


        /*
            MULTIPLE PASSWORDS
        */

        if (
            Array.isArray(
                app.password
            )
        ) {

            return app.password.some(
                password =>
                    String(password)
                        .trim() !== ""
            );

        }


        return false;

    }


    /* =========================================================
       GET PASSWORDS
       ========================================================= */

    function getPasswords(app) {

        if (
            typeof app.password ===
            "string"
        ) {

            if (
                app.password.trim() === ""
            ) {

                return [];

            }


            return [
                app.password
            ];

        }


        if (
            Array.isArray(
                app.password
            )
        ) {

            return app.password

                .map(
                    password =>
                        String(password)
                )

                .filter(
                    password =>
                        password.trim() !== ""
                );

        }


        return [];

    }


    /* =========================================================
       RENDER ALL APPLICATIONS
       IMPORTANT:
       DISABLED CARDS ARE NOT FILTERED.
       ========================================================= */

    function renderApps() {

        grid.innerHTML =
            "";


        /*
            ALL cards remain visible,
            including enabled: 0
        */

        const apps =
            Array.isArray(
                horizonApps
            )
            ?
            horizonApps
            :
            [];


        const activeCount =
            apps.filter(
                app =>
                    Number(app.enabled) === 1
            ).length;


        appCount.textContent =
            `${activeCount} active · ${apps.length} total`;


        if (
            apps.length === 0
        ) {

            grid.innerHTML = `

                <div class="empty-state">

                    No applications added.

                </div>

            `;

            return;

        }


        apps.forEach(
            (app, index) => {


                /*
                    Check whether enabled
                */

                const isEnabled =
                    Number(app.enabled) === 1;


                /*
                    Create card
                */

                const card =
                    document.createElement(
                        "article"
                    );


                /*
                    Disabled class
                */

                card.className =
                    `app-card ${
                        app.size || "normal"
                    } ${
                        isEnabled
                        ?
                        ""
                        :
                        "disabled"
                    }`;


                card.style.animationDelay =
                    `${index * 45}ms`;


                /*
                    Logo
                */

                const logo =
                    app.logo ||
                    "https://i.ibb.co/kgzJb34B/horizon-logo.png";


                /*
                    Password icon
                */

                const protectedApp =
                    hasPassword(app);


                /*
                    Status
                */

                const statusHTML =
                    isEnabled

                    ?

                    `
                    <span
                        class="status-dot"
                        title="Enabled"
                    ></span>
                    `

                    :

                    `
                    <span
                        class="disabled-status"
                        title="Disabled"
                    >
                        Disabled
                    </span>
                    `;


                /*
                    Card HTML
                */

                card.innerHTML = `

                    <div class="card-glow"></div>


                    <div>

                        <div class="card-top">


                            <img

                                class="app-logo"

                                src="${escapeHTML(
                                    logo
                                )}"

                                alt=""

                                loading="lazy"

                                onerror="
                                    this.src='https://i.ibb.co/kgzJb34B/horizon-logo.png'
                                "

                            >


                            <div class="card-status">


                                ${
                                    protectedApp &&
                                    isEnabled

                                    ?

                                    `
                                    <span
                                        class="lock-icon"
                                        title="Password protected"
                                    >
                                        🔒
                                    </span>
                                    `

                                    :

                                    ""

                                }


                                ${statusHTML}


                            </div>


                        </div>


                        <div class="card-content">


                            <div class="card-title">

                                ${escapeHTML(
                                    getAppName(app)
                                )}

                            </div>


                            <div class="card-description">

                                ${escapeHTML(
                                    app.description ||
                                    ""
                                )}

                            </div>


                        </div>


                    </div>


                    <div class="hover-text">

                        ${escapeHTML(
                            app.hoverText ||
                            "Open application"
                        )}

                        &nbsp; →

                    </div>

                `;


                /*
                    CLICK HANDLER

                    ENABLED:
                        Open app.

                    DISABLED:
                        Do absolutely nothing.
                */

                card.addEventListener(
                    "click",
                    () => {

                        if (!isEnabled) {

                            return;

                        }


                        handleAppClick(
                            app
                        );

                    }
                );


                grid.appendChild(
                    card
                );

            }
        );

    }


    /* =========================================================
       HANDLE APPLICATION CLICK
       ========================================================= */

    function handleAppClick(app) {

        if (!app) {

            return;

        }


        /*
            Safety check.
            Even if function is called manually,
            disabled cards cannot open.
        */

        if (
            Number(app.enabled) !== 1
        ) {

            return;

        }


        /*
            No password:
            Directly open.
        */

        if (
            !hasPassword(app)
        ) {

            openApp(
                app
            );

            return;

        }


        /*
            Password required
        */

        pendingApp =
            app;


        passwordInput.value =
            "";


        passwordError.textContent =
            "";


        passwordInput.classList.remove(
            "error"
        );


        passwordModal.classList.add(
            "active"
        );


        setTimeout(
            () => {

                passwordInput.focus();

            },
            150
        );

    }


    /* =========================================================
       SUBMIT PASSWORD
       ========================================================= */

    function submitPassword() {

        if (!pendingApp) {

            return;

        }


        const entered =
            passwordInput.value;


        const validPasswords =
            getPasswords(
                pendingApp
            );


        /*
            ANY matching password works
        */

        const valid =
            validPasswords.some(
                password =>
                    entered === password
            );


        if (!valid) {

            passwordError.textContent =
                "Incorrect password. Please try again.";


            passwordInput.classList.add(
                "error"
            );


            setTimeout(
                () => {

                    passwordInput.classList.remove(
                        "error"
                    );

                },
                350
            );


            passwordInput.focus();


            return;

        }


        const app =
            pendingApp;


        pendingApp =
            null;


        closePasswordModal();


        openApp(
            app
        );

    }


    /* =========================================================
       PASSWORD KEYBOARD
       ========================================================= */

    passwordInput.addEventListener(
        "keydown",
        event => {

            if (
                event.key === "Enter"
            ) {

                submitPassword();

            }


            if (
                event.key === "Escape"
            ) {

                cancelPassword();

            }

        }
    );


    /* =========================================================
       CLOSE PASSWORD MODAL
       ========================================================= */

    function closePasswordModal() {

        passwordModal.classList.remove(
            "active"
        );


        passwordInput.value =
            "";


        passwordError.textContent =
            "";

    }


    /* =========================================================
       CANCEL PASSWORD
       ========================================================= */

    function cancelPassword() {

        pendingApp =
            null;


        closePasswordModal();

    }


    /* =========================================================
       OPEN APP
       ========================================================= */

    function openApp(app) {

        if (
            !app ||
            !app.iframeLink
        ) {

            return;

        }


        /*
            Extra safety check
        */

        if (
            Number(app.enabled) !== 1
        ) {

            return;

        }


        currentApp =
            app;


        /*
            Hide dashboard
        */

        dashboard.classList.add(
            "hidden"
        );


        /*
            Show full-screen iframe
        */

        viewer.classList.add(
            "active"
        );


        /*
            Show loader
        */

        loader.classList.remove(
            "hidden"
        );


        /*
            Clear old iframe
        */

        iframe.src =
            "about:blank";


        /*
            Load requested website
        */

        setTimeout(
            () => {

                iframe.src =
                    app.iframeLink;

            },
            80
        );


        /*
            Add browser history state.

            Browser Back will return
            to Horizon.
        */

        history.pushState(
            {
                horizonViewer:
                    true
            },
            "",
            "#app"
        );

    }


    /* =========================================================
       IFRAME LOADED
       ========================================================= */

    iframe.addEventListener(
        "load",
        () => {

            setTimeout(
                () => {

                    loader.classList.add(
                        "hidden"
                    );

                },
                250
            );

        }
    );


    /* =========================================================
       RETURN TO HORIZON
       ========================================================= */

    function goBack() {

        iframe.src =
            "about:blank";


        viewer.classList.remove(
            "active"
        );


        dashboard.classList.remove(
            "hidden"
        );


        currentApp =
            null;


        /*
            Remove #app
        */

        if (
            location.hash === "#app"
        ) {

            history.replaceState(
                null,
                "",
                location.pathname +
                location.search
            );

        }

    }


    /* =========================================================
       BROWSER BACK BUTTON
       ========================================================= */

    window.addEventListener(
        "popstate",
        () => {

            if (
                viewer.classList.contains(
                    "active"
                )
            ) {

                goBack();

            }

        }
    );


    /* =========================================================
       ESCAPE KEY
       ========================================================= */

    document.addEventListener(
        "keydown",
        event => {

            if (
                event.key !== "Escape"
            ) {

                return;

            }


            /*
                Password modal
            */

            if (
                passwordModal.classList.contains(
                    "active"
                )
            ) {

                cancelPassword();

                return;

            }


            /*
                Iframe
            */

            if (
                viewer.classList.contains(
                    "active"
                )
            ) {

                goBack();

            }

        }
    );


    /* =========================================================
       RENDER IMPORTANT LINKS
       ========================================================= */

    function renderImportantLinks() {

        importantLinksContainer.innerHTML =
            "";


        const links =
            Array.isArray(
                importantLinks
            )
            ?
            importantLinks
            :
            [];


        if (
            links.length === 0
        ) {

            importantLinksContainer.innerHTML = `

                <div class="empty-state">

                    No important links added.

                </div>

            `;

            return;

        }


        links.forEach(
            item => {


                const wrapper =
                    document.createElement(
                        "div"
                    );


                wrapper.className =
                    "important-link";


                wrapper.innerHTML = `

                    <div
                        class="important-info"
                    >


                        <div
                            class="important-name"
                        >

                            ${escapeHTML(
                                item.name
                            )}

                        </div>


                        <div
                            class="important-url"
                        >

                            ${escapeHTML(
                                item.url
                            )}

                        </div>


                    </div>


                    <div
                        class="important-actions"
                    >


                        <button
                            class="link-button copy-button"
                        >

                            Copy

                        </button>


                        <button
                            class="link-button open"
                        >

                            Open

                        </button>


                    </div>

                `;


                /*
                    Copy
                */

                const copyButton =
                    wrapper.querySelector(
                        ".copy-button"
                    );


                copyButton.addEventListener(
                    "click",
                    event => {

                        event.stopPropagation();


                        copyImportantLink(
                            item.url,
                            copyButton
                        );

                    }
                );


                /*
                    Open
                */

                const openButton =
                    wrapper.querySelector(
                        ".open"
                    );


                openButton.addEventListener(
                    "click",
                    event => {

                        event.stopPropagation();


                        openImportantLink(
                            item.url
                        );

                    }
                );


                importantLinksContainer
                    .appendChild(
                        wrapper
                    );

            }
        );

    }


    /* =========================================================
       COPY IMPORTANT LINK
       ========================================================= */

    async function copyImportantLink(
        url,
        button
    ) {

        try {

            await navigator.clipboard.writeText(
                url
            );


            const oldText =
                button.textContent;


            button.textContent =
                "Copied ✓";


            button.classList.add(
                "copy-success"
            );


            setTimeout(
                () => {

                    button.textContent =
                        oldText;


                    button.classList.remove(
                        "copy-success"
                    );

                },
                1500
            );

        }

        catch {

            /*
                Fallback
            */

            const textarea =
                document.createElement(
                    "textarea"
                );


            textarea.value =
                url;


            textarea.style.position =
                "fixed";


            textarea.style.opacity =
                "0";


            document.body.appendChild(
                textarea
            );


            textarea.select();


            document.execCommand(
                "copy"
            );


            textarea.remove();


            button.textContent =
                "Copied ✓";


            setTimeout(
                () => {

                    button.textContent =
                        "Copy";

                },
                1500
            );

        }

    }


    /* =========================================================
       OPEN IMPORTANT LINK
       ========================================================= */

    function openImportantLink(url) {

        if (!url) {

            return;

        }


        window.open(
            url,
            "_blank",
            "noopener,noreferrer"
        );

    }


    /* =========================================================
       INITIALIZE
       ========================================================= */

    renderApps();

    renderImportantLinks();

</script>


</body>

</html>
