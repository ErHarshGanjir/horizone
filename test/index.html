<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Horizon System</title>
    
    <!-- PWA Requirements -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0f172a">
    <link rel="apple-touch-icon" href="icon-192.png">

    <style>
        :root {
            --bg-base: #0f172a;
            --surface: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #38bdf8;
            --border: #334155;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: var(--bg-base);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* Advanced Loader */
        #loader-wrapper {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: var(--bg-base);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.5s ease;
        }

        .spinner {
            width: 60px;
            height: 60px;
            border: 4px solid transparent;
            border-top-color: var(--accent);
            border-bottom-color: var(--accent);
            border-radius: 50%;
            animation: spin 1.2s linear infinite;
        }

        .spinner::before {
            content: '';
            position: absolute;
            top: 8px; left: 8px; right: 8px; bottom: 8px;
            border: 4px solid transparent;
            border-left-color: var(--text-muted);
            border-right-color: var(--text-muted);
            border-radius: 50%;
            animation: spin 0.8s linear infinite reverse;
        }

        .loader-text {
            margin-top: 20px;
            color: var(--text-muted);
            font-size: 0.9rem;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Layout & Navigation */
        header {
            padding: 1rem;
            background-color: var(--surface);
            border-bottom: 1px solid var(--border);
            display: flex;
            overflow-x: auto;
            gap: 1rem;
            -webkit-overflow-scrolling: touch;
        }

        header a {
            color: var(--text-muted);
            text-decoration: none;
            padding: 0.5rem 1rem;
            border: 1px solid var(--border);
            border-radius: 4px;
            white-space: nowrap;
            transition: border-color 0.2s;
        }

        header a:hover {
            border-color: var(--accent);
            color: var(--text-main);
        }

        /* Dashboard Grid */
        main {
            padding: 1.5rem;
            flex: 1;
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 1.5rem;
            margin-bottom: 2rem;
        }

        .app-card {
            background-color: var(--surface);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 1rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 1rem;
            transition: transform 0.2s;
        }

        .app-card:active {
            transform: scale(0.98);
        }

        .app-card img {
            width: 48px;
            height: 48px;
            border-radius: 4px;
            object-fit: cover;
        }

        /* iFrame Viewer Overlay */
        #viewer-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: var(--bg-base);
            z-index: 1000;
            flex-direction: column;
        }

        .viewer-header {
            display: flex;
            justify-content: space-between;
            padding: 1rem;
            background-color: var(--surface);
            border-bottom: 1px solid var(--border);
        }

        .close-btn {
            background: none;
            border: 1px solid var(--border);
            color: var(--text-main);
            padding: 0.5rem 1rem;
            border-radius: 4px;
            cursor: pointer;
        }

        iframe {
            flex: 1;
            width: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <!-- Initializer -->
    <div id="loader-wrapper">
        <div class="spinner"></div>
        <div class="loader-text">Initializing System</div>
    </div>

    <!-- Navigation -->
    <header id="nav-container"></header>

    <!-- App Dashboard -->
    <main>
        <div class="grid-container" id="app-container"></div>
    </main>

    <!-- iFrame Viewer -->
    <div id="viewer-overlay">
        <div class="viewer-header">
            <span id="viewer-title">Module</span>
            <button class="close-btn" onclick="closeViewer()">Close</button>
        </div>
        <iframe id="app-frame" src=""></iframe>
    </div>

    <script>
        // Mock Data Structures
        const importantLinks = [
            { title: "Root", url: "/" },
            { title: "Order Desk", url: "/order/" },
            { title: "Robopost", url: "/robopost/" },
            { title: "ChequeBook", url: "/chequebook/" }
        ];

        const horizonApps = [
            {
                title: "Real Time Tracking System",
                logo: "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNkYAAAAAYAAjCB0C8AAAAASUVORK5CYII=", // Replace with actual base64
                exec: "https://script.google.com/macros/s/..." 
            }
        ];

        // Initialization Logic
        window.addEventListener('load', () => {
            renderNav();
            renderApps();
            
            // Remove loader after rendering
            setTimeout(() => {
                const loader = document.getElementById('loader-wrapper');
                loader.style.opacity = '0';
                setTimeout(() => loader.remove(), 500);
            }, 800); // Artificial delay for visual effect
        });

        // Render Components
        function renderNav() {
            const container = document.getElementById('nav-container');
            importantLinks.forEach(link => {
                const a = document.createElement('a');
                a.href = link.url;
                a.target = '_blank';
                a.textContent = link.title;
                container.appendChild(a);
            });
        }

        function renderApps() {
            const container = document.getElementById('app-container');
            horizonApps.forEach(app => {
                const card = document.createElement('div');
                card.className = 'app-card';
                card.onclick = () => openViewer(app.title, app.exec);
                
                card.innerHTML = `
                    <img src="${app.logo}" alt="icon">
                    <div>
                        <div style="font-weight: 500;">${app.title}</div>
                        <div style="font-size: 0.8rem; color: var(--text-muted);">EXEC MODULE</div>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        // iFrame Logic
        function openViewer(title, url) {
            document.getElementById('viewer-title').textContent = title;
            document.getElementById('app-frame').src = url;
            document.getElementById('viewer-overlay').style.display = 'flex';
        }

        function closeViewer() {
            document.getElementById('viewer-overlay').style.display = 'none';
            document.getElementById('app-frame').src = '';
        }

        // PWA Service Worker Registration
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js').catch(err => {
                    console.error('ServiceWorker registration failed:', err);
                });
            });
        }
    </script>
</body>
</html>
